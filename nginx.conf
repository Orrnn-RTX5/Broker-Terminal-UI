server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri =404;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri =404;
  }

  location = /runtime-config.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri @asset_missing;
  }

  # Public login artwork keeps stable filenames. Serve it immediately on
  # repeat visits while revalidating updates in the background.
  location ~ ^/(brand|login)/ {
    add_header Cache-Control "public, max-age=3600, stale-while-revalidate=2592000" always;
    try_files $uri @asset_missing;
  }

  location @asset_missing {
    add_header Cache-Control "no-store" always;
    return 404;
  }

  location / {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }
}
