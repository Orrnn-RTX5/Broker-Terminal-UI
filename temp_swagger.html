<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trading Engine RTX â€” API Documentation</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Inter, sans-serif;
      background: #0f1117;
    }

    /* Top Header */
    .rtx-header {
      background: linear-gradient(135deg, #1a1f2e 0%, #0d1321 100%);
      border-bottom: 1px solid #2a3050;
      padding: 18px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
    }

    .rtx-logo {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 18px;
      color: white;
    }

    .rtx-title {
      flex: 1;
    }

    .rtx-title h1 {
      color: #e2e8f0;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .rtx-title p {
      color: #64748b;
      font-size: 12px;
      margin-top: 2px;
    }

    .rtx-badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .badge-blue {
      background: #1e3a5f;
      color: #60a5fa;
      border: 1px solid #2563eb44;
    }

    .badge-green {
      background: #14532d;
      color: #4ade80;
      border: 1px solid #16a34a44;
    }

    .badge-purple {
      background: #3b1f6b;
      color: #a78bfa;
      border: 1px solid #7c3aed44;
    }

    /* Port info bar */
    .port-bar {
      background: #13161f;
      border-bottom: 1px solid #1e2438;
      padding: 10px 32px;
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
    }

    .port-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #94a3b8;
    }

    .port-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.4;
      }
    }

    .dot-blue {
      background: #3b82f6;
      box-shadow: 0 0 6px #3b82f6;
    }

    .dot-green {
      background: #22c55e;
      box-shadow: 0 0 6px #22c55e;
    }

    .dot-orange {
      background: #f97316;
      box-shadow: 0 0 6px #f97316;
    }

    /* Swagger UI Overrides */
    #swagger-ui {
      background: #0f1117;
    }

    .swagger-ui .topbar {
      display: none !important;
    }

    .swagger-ui .info {
      margin: 24px 0 0;
    }

    .swagger-ui .info .title {
      color: #e2e8f0 !important;
      font-size: 24px !important;
    }

    .swagger-ui .info .description {
      color: #94a3b8 !important;
    }

    .swagger-ui .info a {
      color: #60a5fa !important;
    }

    .swagger-ui .wrapper {
      padding: 0 28px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Tag sections */
    .swagger-ui .opblock-tag {
      background: #1a1f2e !important;
      border: 1px solid #2a3050 !important;
      border-radius: 10px !important;
      margin: 10px 0 !important;
      padding: 12px 16px !important;
      color: #e2e8f0 !important;
    }

    .swagger-ui .opblock-tag:hover {
      background: #1e2540 !important;
    }

    .swagger-ui .opblock-tag a {
      color: #e2e8f0 !important;
      text-decoration: none !important;
    }

    .swagger-ui .opblock-tag small {
      color: #64748b !important;
    }

    /* Method blocks */
    .swagger-ui .opblock {
      border-radius: 8px !important;
      margin: 6px 0 !important;
      border: none !important;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3) !important;
    }

    .swagger-ui .opblock.opblock-get {
      background: #0f2744 !important;
      border-left: 4px solid #3b82f6 !important;
    }

    .swagger-ui .opblock.opblock-post {
      background: #0f2f1a !important;
      border-left: 4px solid #22c55e !important;
    }

    .swagger-ui .opblock.opblock-delete {
      background: #2f0f0f !important;
      border-left: 4px solid #ef4444 !important;
    }

    .swagger-ui .opblock.opblock-put {
      background: #2f1f0f !important;
      border-left: 4px solid #f97316 !important;
    }

    .swagger-ui .opblock .opblock-summary {
      border: none !important;
    }

    .swagger-ui .opblock .opblock-summary-description {
      color: #94a3b8 !important;
    }

    .swagger-ui .opblock .opblock-summary-path {
      color: #e2e8f0 !important;
      font-family: 'Fira Code', monospace !important;
      font-size: 13px !important;
    }

    /* HTTP method labels */
    .swagger-ui .opblock-summary-method {
      border-radius: 5px !important;
      font-weight: 700 !important;
      font-size: 11px !important;
      letter-spacing: 0.5px !important;
      min-width: 60px !important;
      padding: 4px 8px !important;
    }

    /* Body and params */
    .swagger-ui .opblock-body,
    .swagger-ui .parameters-container {
      background: #13161f !important;
    }

    .swagger-ui table {
      background: transparent !important;
    }

    .swagger-ui table thead tr {
      background: #1a1f2e !important;
    }

    .swagger-ui .parameter__name {
      color: #e2e8f0 !important;
    }

    .swagger-ui .parameter__type {
      color: #94a3b8 !important;
    }

    .swagger-ui .response-col_status {
      color: #22c55e !important;
    }

    /* Try it out button */
    .swagger-ui .btn.try-out__btn {
      background: #1d4ed8 !important;
      border-color: #1d4ed8 !important;
      color: white !important;
      border-radius: 6px !important;
      font-weight: 600 !important;
    }

    .swagger-ui .btn.execute {
      background: linear-gradient(135deg, #3b82f6, #2563eb) !important;
      border-color: #1d4ed8 !important;
      color: white !important;
      border-radius: 6px !important;
      font-weight: 600 !important;
    }

    .swagger-ui .btn.cancel {
      border-radius: 6px !important;
      color: #94a3b8 !important;
    }

    /* Code / response area */
    .swagger-ui .highlight-code,
    .swagger-ui .microlight {
      background: #0d1117 !important;
      border-radius: 8px !important;
      color: #d1d5db !important;
    }

    .swagger-ui textarea {
      background: #0d1117 !important;
      color: #d1d5db !important;
      border: 1px solid #2a3050 !important;
      border-radius: 6px !important;
    }

    .swagger-ui input[type=text],
    .swagger-ui input[type=password] {
      background: #13161f !important;
      border: 1px solid #2a3050 !important;
      color: #e2e8f0 !important;
      border-radius: 6px !important;
    }

    /* Model area */
    .swagger-ui .model-box {
      background: #13161f !important;
      border-radius: 8px !important;
    }

    .swagger-ui .model-title {
      color: #e2e8f0 !important;
    }

    .swagger-ui .model {
      color: #94a3b8 !important;
    }

    /* Authorize button */
    .swagger-ui .btn.authorize {
      border-color: #22c55e !important;
      color: #22c55e !important;
      border-radius: 6px !important;
      font-weight: 600 !important;
    }

    .swagger-ui .btn.authorize svg {
      fill: #22c55e !important;
    }

    /* Info section */
    .swagger-ui .info pre {
      background: #13161f !important;
      border-radius: 8px !important;
      color: #94a3b8 !important;
      border: 1px solid #2a3050 !important;
    }

    .swagger-ui .scheme-container {
      background: #13161f !important;
      border: 1px solid #2a3050 !important;
      border-radius: 8px !important;
      padding: 12px !important;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #0f1117;
    }

    ::-webkit-scrollbar-thumb {
      background: #2a3050;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #3b82f6;
    }
  </style>
</head>

<body>

  <div class="rtx-header">
    <div class="rtx-logo">R</div>
    <div class="rtx-title">
      <h1>Trading Engine RTX</h1>
      <p>Complete API Documentation â€” All Services</p>
    </div>
    <div class="rtx-badges">
      <span class="badge badge-blue">v1.0.0</span>
      <span class="badge badge-green">OpenAPI 3.0</span>
      <span class="badge badge-purple">22 Endpoints</span>
    </div>
  </div>

  <div class="port-bar">
    <div class="port-item">
      <div class="port-dot dot-blue"></div> Gateway Backend â€” <strong>:7999</strong>
    </div>
    <div class="port-item">
      <div class="port-dot dot-green"></div> MT5 Sync C++ â€” <strong>:8088</strong>
    </div>
    <div class="port-item">
      <div class="port-dot dot-orange"></div> FIX API Backend â€” <strong>:8081</strong>
    </div>
  </div>

  <div id="swagger-ui"></div>


  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = () => {
      const ui = SwaggerUIBundle({
        url: "/swagger.yaml",
        dom_id: '#swagger-ui',
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        layout: 'StandaloneLayout',
        deepLinking: true,
        displayRequestDuration: true,
        tryItOutEnabled: true,
        defaultModelsExpandDepth: 1,
        defaultModelExpandDepth: 1,
        docExpansion: 'list',
        filter: true,
        showExtensions: true,
        showCommonExtensions: true,
        tagsSorter: 'alpha',
        operationsSorter: (a, b) => {
          const order = { get: 0, post: 1, put: 2, delete: 3 };
          return (order[a.get('method')] || 9) - (order[b.get('method')] || 9);
        },
        requestInterceptor: (req) => {
          req.url = req.url.replace(/https?:\/\/localhost:7999/g, window.location.origin);
          return req;
        },
        responseInterceptor: (res) => {
          if (res.url && res.url.includes('/api/login') && res.status === 200) {
            try {
              const body = typeof res.body === 'string' ? JSON.parse(res.body) : res.body;
              if (body && body.access_token) {
                localStorage.setItem('rtx_token', body.access_token);
                ui.preauthorizeApiKey('BearerAuth', body.access_token);
                showToast('Token captured — all APIs are now authorized.');
              }
            } catch (e) {}
          }
          return res;
        },
        onComplete: () => {
          const saved = localStorage.getItem('rtx_token');
          if (saved) {
            ui.preauthorizeApiKey('BearerAuth', saved);
            showToast('Previous session token restored.');
          }
          const origin = window.location.origin;
          if (origin && origin !== 'null' && !origin.startsWith('file')) {
            document.querySelectorAll('.servers select').forEach(sel => {
              Array.from(sel.options).forEach(opt => {
                if (opt.value.includes('localhost:7999')) {
                  opt.value = origin;
                  opt.text  = origin + ' (current)';
                }
              });
              sel.dispatchEvent(new Event('change'));
            });
          }
        },
      });

      function showToast(msg) {
        const t = document.createElement('div');
        t.textContent = msg;
        Object.assign(t.style, {
          position:'fixed', bottom:'24px', right:'24px',
          background:'#1e3a5f', color:'#60a5fa',
          border:'1px solid #2563eb', borderRadius:'8px',
          padding:'12px 20px', fontSize:'14px', fontWeight:'600',
          zIndex:'9999', boxShadow:'0 4px 16px rgba(0,0,0,0.5)',
          transition:'opacity 0.5s', opacity:'1',
        });
        document.body.appendChild(t);
        setTimeout(() => { t.style.opacity = '0'; }, 3000);
        setTimeout(() => t.remove(), 3600);
      }
    };
  </script>
</body>
</html>
