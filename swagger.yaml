openapi: 3.0.3
info:
  title: RTX5 Trading Platform API
  description: |
    Complete API documentation for all RTX5 backend services (excluding Manager Backend, which has its own Swagger).
    Timestamps are Unix int64 (seconds unless noted otherwise).

    ## Authentication
    Most Core Gateway endpoints require either a **Bearer token** (obtained via `/api/v2/auth/login`)
    or an **API key** (obtained via `/api/v2/auth/register`), passed in the `X-API-Key` header.

    ## Error Handling
    All errors follow a consistent JSON format with `error` and `message` fields.

    ## Security & Data Integrity
    - **Transaction atomicity:** All balance-modifying operations (orders, deposits, withdrawals, position closures) use database transactions to guarantee atomicity.
    - **Zero-price validation:** Market orders and position closures are rejected if live market data returns zero or negative prices, preventing erroneous fills.
    - **Account ownership:** Most account-specific endpoints enforce ownership checks â€” only the authenticated user who owns the account can access or modify it. Unauthorized access returns 404.
    - **Amount validation:** Deposit/withdrawal amounts must be positive and cannot exceed 1,000,000. Credit amounts must be non-zero.
    - **SL/TP validation:** Stop-loss and take-profit values are validated against the current market price (not the position open price).

    ## Rate Limiting
    - Auth endpoints (login, register, refresh): 10 requests/minute per IP
    - Trading endpoints (orders, close): 60 requests/minute per account
    - Balance endpoints (deposit, withdraw, credit): 10 requests/minute per account (admin only)
    - General API: 300 requests/minute per IP
    A `429 Too Many Requests` response is returned when limits are exceeded, with a `Retry-After` header.

    ## Services
    | Service | Port | Prefix |
    |---------|------|--------|
    | Core Gateway | 8090 | /api/v2 |
    | **RTX5 Tech Admin** | **8102** | **/rtx5** |
    | Risk Backend | 8092 | /risk/v1 |
    | LP Gateway | 8094 | /lp/v1 |
    | Reports Backend | 8095 | /reports/v1 |
    | Exchange Gateway | 8096 | /exchange/v1 |
    | News Backend | 8097 | /news/v1 |
    | History Backend | 8098 | /history |
    | Logging Backend | 8099 | /logging/v1 |
    | License Server | 8100 | /license-server/v1 |
    | License Agent | 8100 | /license |
  version: 5.0.0
  contact:
    name: RTX5 Team

servers:
  - url: https://backend.orrnn.com
    description: RTX5 Production (Cloudflare Tunnel)

security:
  - BearerAuth: []
  - ApiKeyAuth: []

tags:
  # Core Gateway (8090)
  - name: "RTX5 Tech Admin"
    description: |
      RTX5 Platform Admin API â€” **standalone service on port 8102**.
      For RTX5 tech team ONLY (not brokers).
      Register brokers, manage broker servers, suspend/activate brokers.
      Requires admin role JWT.

      **Swagger UI:** https://backend.orrnn.com/rtx5/swagger
      **Base URL:** https://backend.orrnn.com/rtx5/api/v1
  - name: System
    description: Health and status endpoints
  - name: Auth
    description: Authentication, registration, and token management
  - name: Market Data
    description: Instruments, quotes, candles, and depth
  - name: Accounts
    description: Account management, deposits, withdrawals, and credit operations
  - name: Trading
    description: Market orders, positions, and deal history
  - name: Pending Orders
    description: Limit and stop pending order management
  - name: OCO Orders
    description: One-Cancels-Other order pairs
  - name: Watchlist
    description: User watchlist management
  - name: Notifications
    description: User notification management
  - name: Webhooks
    description: Webhook subscription management
  - name: Alerts
    description: Price alert management
  - name: Devices
    description: Push notification device registration
  - name: Support
    description: Support ticket system
  - name: Contests
    description: Trading contest management
  - name: Social
    description: Trader public profiles
  - name: Calculators
    description: Margin and profit calculation utilities
  - name: Copy Trading
    description: Social / copy trading features
  - name: Prop Firm
    description: Proprietary trading firm challenge and payout management
  - name: Bonuses
    description: Bonus and promotion management
  - name: IB
    description: Introducing Broker referral management
  - name: Admin
    description: Administrative endpoints for system monitoring and bulk operations
  - name: WebSocket
    description: Real-time streaming via WebSocket
  # Risk Backend (8092)
  - name: "Risk: Exposure"
    description: Real-time exposure monitoring (port 8092)
  - name: "Risk: Rules"
    description: Risk rule management (port 8092)
  - name: "Risk: Alerts"
    description: Risk alert monitoring (port 8092)
  - name: "Risk: Dealing"
    description: Dealing desk queue management (port 8092)
  # LP Gateway (8094)
  - name: LP Gateway
    description: Liquidity provider management, fill tracking, and order routing (port 8094)
  # Reports Backend (8095)
  - name: Reports
    description: Account statements, equity curves, daily summaries, and exports (port 8095)
  # Exchange Gateway (8096)
  - name: Exchange Gateway
    description: Market data feed management and exchange connectivity (port 8096)
  # News Backend (8097)
  - name: News
    description: Financial news and economic calendar (port 8097)
  # History Backend (8098)
  - name: "History: Candles"
    description: Historical candle data and batch retrieval (port 8098)
  - name: "History: Ticks"
    description: Raw tick data retrieval (port 8098)
  - name: "History: Stats"
    description: Data coverage statistics (port 8098)
  - name: "History: Admin"
    description: Candle generation and admin operations (port 8098)
  - name: "History: WebSocket"
    description: Real-time candle update streaming (port 8098)
  # Logging Backend (8099)
  - name: "Audit: Search"
    description: Audit trail search and full-text search (port 8099)
  - name: "Audit: Export"
    description: Audit log export for compliance (port 8099)
  - name: "Audit: Metrics"
    description: Latency and volume metrics from audit data (port 8099)
  # License Server (8100)
  - name: "License: Management"
    description: License CRUD, suspension, and revocation (port 8100 â€” RTX5 internal)
  - name: "License: Validation"
    description: License validation and heartbeat (port 8100)
  - name: "License: Usage"
    description: Usage tracking and billing dashboard (port 8100 â€” RTX5 internal)
  # License Agent (8100)
  - name: "License: Agent"
    description: Local license enforcement checks (port 8100 â€” broker-side)
  # Orrnn demo broker
  - name: "Orrnn Demo"
    description: |
      Public (no-auth) endpoints for creating demo trading accounts on the centralized
      **orrnn** broker. The orrnn broker has unlimited accounts, no license limit, and
      only demo groups are allowed. Accounts can only be created through these endpoints;
      DB triggers reject any admin/manager-initiated account under broker_id='orrnn'.

paths:
  # ===========================================================================
  # CORE GATEWAY â€” System (port 8090)
  # ===========================================================================
  /health:
    get:
      operationId: getHealth
      tags: [System]
      summary: Gateway health check
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: rtx5-gateway
                  time:
                    type: string
                    format: date-time

  /api/v2/time:
    get:
      operationId: getServerTime
      tags: [System]
      summary: Get server time
      security: []
      responses:
        "200":
          description: Server time
          content:
            application/json:
              schema:
                type: object
                properties:
                  time:
                    type: integer
                    format: int64
                  iso:
                    type: string
                    format: date-time

  /ws/v2:
    get:
      operationId: websocketConnect
      tags: [WebSocket]
      summary: Open WebSocket connection for real-time data
      security: []
      description: |
        Upgrades to WebSocket for real-time streaming. Authentication required for account-specific channels.

        ## Authentication
        Connect with JWT token: `ws://host/ws/v2?token=YOUR_JWT_TOKEN`

        Authentication is required. The token must be a valid JWT obtained from the login endpoint.

        ## Channel Authorization
        Account-specific channels (positions.{login}, account.{login}, orders.{login})
        require that the login belongs to the authenticated user. Public channels
        (ticks.{symbol}, candles.{symbol}) are available to all authenticated connections.

        ## Subscribe/Unsubscribe
        ```json
        {"action": "subscribe", "channel": "ticks.XAUUSD"}
        {"action": "unsubscribe", "channel": "ticks.XAUUSD"}
        ```

        ## Available Channels

        **Public (no auth required):**
        | Channel | Description |
        |---------|-------------|
        | `ticks.{SYMBOL}` | Live bid/ask per tick for a symbol |
        | `ticks.all` | All symbols fire-hose |
        | `depth.{SYMBOL}` | Order book updates |
        | `news` | Breaking news broadcast |
        | `announcements` | Server announcements |
        | `system` | Maintenance, symbol halt events |
        | `candles.{SYMBOL}.{TF}` | Candle update + snapshot on subscribe |

        **Authenticated (requires Bearer token):**
        | Channel | Description |
        |---------|-------------|
        | `positions.{LOGIN}` | Position open/close/update/sl_hit/tp_hit |
        | `account.{LOGIN}` | Equity, margin, free_margin, margin_level per tick |
        | `alerts.{LOGIN}` | Margin call, stop out events |
        | `orders.{LOGIN}` | Pending order triggered/cancelled |
        | `deals.{LOGIN}` | Deal executed |
        | `notifications.{LOGIN}` | User notification events |

        ## Authentication
        Send auth message after connecting:
        ```json
        {"action": "auth", "token": "JWT_TOKEN_HERE"}
        ```

        ## Candle Snapshot
        On subscribing to `candles.{SYMBOL}.{TF}`, the server immediately sends the last 50 candles as a snapshot, then streams updates.
      responses:
        "101":
          description: Switching Protocols



  /api/v2/auth/login:
    post:
      operationId: authLogin
      tags: [Auth]
      summary: Authenticate user â€” direct or via broker server proxy
      security: []
      description: |
        **`broker_id` is REQUIRED** for all trader/manager logins. Admin users can login without it.

        Rate limited: 10 requests per minute per IP address.

        Accepts `username` (email), `email`, or `login` (account number) as the identifier.

        **Flow 1 â€” Direct Login (broker's own app):**
        Send `username` + `password` + `broker_id`. Validates locally against this server's database.
        The user must belong to the specified broker â€” otherwise login is rejected.

        **Flow 2 â€” Global Terminal Login (proxy to broker server):**
        Send `username` + `password` + `server` (broker's IP:port). The RTX5 server looks up the
        broker in the `broker_servers` registry, forwards the login request to that broker's server,
        and returns the broker's response enriched with `broker_id`, `broker_name`, and `broker_server`.

        **Validation:**
        - Broker must exist in the system and be `active`
        - User must belong to the specified broker
        - Suspended/terminated brokers are rejected

        Use `GET /rtx5/api/v1/broker/servers` to retrieve the list of registered broker servers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, broker_id]
              properties:
                username:
                  type: string
                  description: "User's email or username (use this OR login OR email)"
                  example: john@fxtrust.com
                login:
                  type: integer
                  description: "Account login number (alternative to username)"
                  example: 200007
                email:
                  type: string
                  description: "Alias for username"
                  example: john@fxtrust.com
                password:
                  type: string
                  description: User's password
                  example: "REDACTED â€” set via environment variable"
                broker_id:
                  type: string
                  description: "**Required.** Broker identifier the user belongs to"
                  example: fxtrust
                server:
                  type: string
                  description: "Broker server address in ip:port format (optional â€” for global terminal proxy login)"
                  example: "69.197.178.27:8090"
            examples:
              login_by_email:
                summary: Login by email + broker_id
                value:
                  username: john@fxtrust.com
                  password: "REDACTED â€” set via environment variable"
                  broker_id: fxtrust
              login_by_account_number:
                summary: Login by account number + broker_id
                value:
                  login: 200007
                  password: "REDACTED â€” set via environment variable"
                  broker_id: fxtrust
              global_terminal:
                summary: Global terminal login (proxy to broker)
                value:
                  username: john@fxtrust.com
                  password: "REDACTED â€” set via environment variable"
                  server: "69.197.178.27:8090"
              admin_login:
                summary: Admin login (no broker_id needed)
                value:
                  username: admin
                  password: "REDACTED â€” set via environment variable"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT Bearer token
                  user_id:
                    type: integer
                  username:
                    type: string
                  role:
                    type: string
                    enum: [admin, manager, trader]
                  account_login:
                    type: integer
                  broker_id:
                    type: string
                    description: "Broker identifier (always present in proxy mode)"
                  broker_name:
                    type: string
                    description: "Broker display name (proxy mode only)"
                  broker_server:
                    type: string
                    description: "Broker server address (proxy mode only)"
                  expires_at:
                    type: integer
                    format: int64
        "400":
          description: Invalid input or unregistered server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: |
            Authentication failed. Possible errors:
            - `UNAUTHORIZED` â€” Invalid credentials (wrong password)
            - `BROKER_MISMATCH` â€” User does not belong to the specified broker
            - `INVALID_BROKER` â€” Broker not found in the system
            - `BROKER_INACTIVE` â€” Broker is suspended or terminated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limited â€” too many requests. Check Retry-After header.
        "502":
          description: Broker server unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v2/auth/register:
    post:
      operationId: authRegister
      tags: [Auth]
      summary: Register a new trading account
      security: []
      description: |
        Creates a new trading account + user login in one step.
        The `broker_id` links the account to a registered broker.
        Returns a JWT token so the user is logged in immediately.

        Rate limited: 10 requests per minute per IP address.
        broker_id is required for non-admin accounts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name, broker_id]
              properties:
                email:
                  type: string
                  format: email
                  example: trader@example.com
                password:
                  type: string
                  example: "REDACTED â€” set via environment variable"
                name:
                  type: string
                  example: John Doe
                broker_id:
                  type: string
                  description: "**Required.** Broker this account belongs to"
                  example: fxtrust
                group:
                  type: string
                  description: Account group (default demo_standard)
                  example: demo_standard
                leverage:
                  type: integer
                  description: Account leverage (default 100)
                  example: 100
                currency:
                  type: string
                  description: Account currency (default USD)
                  example: USD
                referral_code:
                  type: string
                  description: IB referral code to link this account
      responses:
        "201":
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limited â€” too many requests. Check Retry-After header.

  /api/v2/auth/me:
    get:
      operationId: authMe
      tags: [Auth]
      summary: Get current authenticated user profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v2/auth/refresh:
    post:
      operationId: authRefreshToken
      tags: [Auth]
      summary: Refresh JWT access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "401":
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v2/auth/change-password:
    post:
      operationId: authChangePassword
      tags: [Auth]
      summary: Change current user password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v2/auth/keys:
    get:
      operationId: listAPIKeys
      tags: [Auth]
      summary: List all API keys for current user
      responses:
        "200":
          description: API key list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/APIKey"
    post:
      operationId: createAPIKey
      tags: [Auth]
      summary: Create a new API key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                scopes:
                  type: array
                  items:
                    type: string
      responses:
        "201":
          description: API key created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKey"

  /api/v2/auth/keys/{id}:
    delete:
      operationId: revokeAPIKey
      tags: [Auth]
      summary: Revoke an API key
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Key revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "404":
          description: Key not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v2/auth/sessions:
    get:
      operationId: listSessions
      tags: [Auth]
      summary: List active sessions for current user
      responses:
        "200":
          description: Session list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    ip:
                      type: string
                    user_agent:
                      type: string
                    created_at:
                      type: integer
                      format: int64
    delete:
      operationId: logoutAllSessions
      tags: [Auth]
      summary: Logout from all sessions
      responses:
        "200":
          description: All sessions terminated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /api/v2/auth/sessions/{id}:
    delete:
      operationId: revokeSession
      tags: [Auth]
      summary: Revoke a specific session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v2/broker/config:
    get:
      operationId: getBrokerConfig
      tags: [System]
      summary: Get broker branding configuration
      description: |
        Returns broker-specific configuration. Resolves broker from:
        1. `broker_id` query param (explicit)
        2. Bearer token (auto-detects logged-in user's broker)
        3. Falls back to platform defaults if neither provided
      parameters:
        - name: broker_id
          in: query
          required: false
          schema:
            type: string
          description: Broker ID to fetch config for (optional if Bearer token is provided)
      responses:
        "200":
          description: Broker branding config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerConfig"

  /api/v2/broker/servers:
    get:
      operationId: listBrokerServers
      tags: [System]
      summary: List all registered broker servers
      description: |
        Public endpoint â€” terminals call this to show the broker server list in the login screen.
        Each broker can have multiple servers in different regions. Traders select a server and
        pass it as the `server` field in the login request.
      security: []
      responses:
        "200":
          description: List of registered broker servers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BrokerServer"

  # ===========================================================================
  # CORE GATEWAY â€” Market Data (port 8090)
  # ===========================================================================
  /api/v2/market/status:
    get:
      operationId: getMarketStatus
      tags: [Market Data]
      summary: Get overall market status
      responses:
        "200":
          description: Market status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketStatus"

  /api/v2/market/status/{symbol}:
    get:
      operationId: getMarketStatusSymbol
      tags: [Market Data]
      summary: Get market status for a specific symbol
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Symbol market status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketStatus"
        "404":
          description: Symbol not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v2/instruments:
    get:
      operationId: getInstruments
      tags: [Market Data]
      summary: List all available trading instruments
      responses:
        "200":
          description: Instrument list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Instrument"

  /api/v2/quotes:
    get:
      operationId: getMultiQuotes
      tags: [Market Data]
      summary: Get quotes for multiple symbols
      parameters:
        - name: symbols
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated symbol list
      responses:
        "200":
          description: Quotes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tick"

  /api/v2/quotes/{symbol}:
    get:
      operationId: getQuote
      tags: [Market Data]
      summary: Get latest quote for a symbol
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Latest quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tick"
        "404":
          description: Symbol not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v2/candles/{symbol}:
    get:
      operationId: getCandles
      tags: [Market Data]
      summary: Get OHLCV candle data for a symbol
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
        - name: timeframe
          in: query
          schema:
            type: string
            enum: [M1, M5, M15, M30, H1, H4, D1, W1, MN]
            default: H1
        - name: from
          in: query
          schema:
            type: integer
            format: int64
          description: Unix timestamp start
        - name: to
          in: query
          schema:
            type: integer
            format: int64
          description: Unix timestamp end
        - name: limit
          in: query
          schema:
            type: integer
            default: 500
      responses:
        "200":
          description: Candle data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Candle"

  /api/v2/ticks/{symbol}:
    get:
      operationId: getTickHistory
      tags: [Market Data]
      summary: Get tick history for a symbol
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: Tick history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tick"

  /api/v2/depth/{symbol}:
    get:
