      summary: Get all deals for the authenticated trader's own account
      description: |
        Returns deal history for the account linked to the authenticated user's session.
        No login parameter required â€” the account is resolved from the JWT token.
        Supports optional date range filtering via from/to Unix timestamps.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 500
            maximum: 1000
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: from
          in: query
          description: Start time (Unix timestamp)
          schema:
            type: integer
            format: int64
        - name: to
          in: query
          description: End time (Unix timestamp, defaults to now)
          schema:
            type: integer
            format: int64
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Deal history
