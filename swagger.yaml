    put:
      operationId: modifyPosition
      tags: [Trading]
      summary: Modify SL/TP of an open position
      description: |
        Requires account ownership. Returns 404 if the position is not owned by the authenticated user.
        SL/TP values are validated against the current market price (not the position open price).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                price_sl:
                  type: number
                  format: double
                price_tp:
                  type: number
                  format: double
                trailing_stop:
                  type: integer
                  description: Trailing stop distance in points
                trailing_step:
                  type: integer
                  description: Trailing step in points
      responses:
        "200":
          description: Position modified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Position"
        "400":
          description: Invalid SL/TP â€” values are validated against current market price
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Position not found or not owned by authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

