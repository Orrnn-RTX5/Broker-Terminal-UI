  /api/v2/orders:
    post:
      operationId: placeOrder
      tags: [Trading]
      summary: Place a market order
      description: |
        The account_login must belong to the authenticated user.
        Rate limited: 60 requests per minute per account.
        Uses a DB transaction for atomicity. Rejected if market data returns zero or negative prices.
        SL/TP values (if provided) are validated against the current market price.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, symbol, side, volume]
              properties:
                login:
                  type: integer
                  format: int64
                symbol:
                  type: string
                side:
                  type: string
                  enum: [buy, sell]
                volume:
                  type: number
                  format: double
                price_sl:
                  type: number
                  format: double
                price_tp:
                  type: number
                  format: double
                comment:
                  type: string
                trailing_stop:
                  type: integer
                  description: Trailing stop distance in points
                trailing_step:
                  type: integer
                  description: Trailing step in points
                magic:
                  type: integer
                  format: int64
                  description: EA magic number
      responses:
        "200":
          description: Order executed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Position"
        "400":
          description: Order rejected â€” invalid SL/TP (validated against current market price), zero/negative market price, or invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limited â€” too many requests. Check Retry-After header.

  /api/v2/positions/{id}/close:
    post:
      operationId: closePosition
      tags: [Trading]
      summary: Close a specific position by ticket
      description: |
        The position must belong to an account owned by the authenticated user.
        Uses a DB transaction for atomicity. Rejected if market data returns zero or negative prices.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
