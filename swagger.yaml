  # ===========================================================================
  # ORRNN DEMO â€” Public (no auth) demo account creation (proxied to Manager 8091)
  # ===========================================================================
  /api/v1/public/demo-status:
    get:
      operationId: orrnnDemoStatus
      tags: ["Orrnn Demo"]
      summary: Demo broker health and status
      description: |
        Returns the health of the **orrnn** demo account subsystem.
        Use this endpoint to verify the demo broker is reachable before
        showing the account-creation form in the user-label frontend.
      security: []
      responses:
        "200":
          description: Demo system healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:               {type: string, example: orrnn-demo}
                  status:                {type: string, enum: [ok, degraded, error], example: ok}
                  broker:                {type: string, example: active}
                  demo_groups_available: {type: integer, example: 1}
                  total_demo_accounts:   {type: integer, example: 0}
                  database:              {type: string, example: connected}
        "503":
          description: Demo system unavailable

  /api/v1/public/demo-groups:
    get:
      operationId: orrnnDemoGroups
      tags: ["Orrnn Demo"]
      summary: List available demo groups for the orrnn broker
      description: |
        Returns all enabled demo groups under broker_id='orrnn'.
        Use the `name` field from the response as the `group` in the
        POST /api/v1/public/demo-account request.
      security: []
      responses:
        "200":
          description: List of demo groups
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups:
                    type: array
                    items:
                      type: object
                      properties:
                        name:        {type: string, example: orrnn/demo-std}
                        description: {type: string, example: Orrnn Standard Demo}
                        currency:    {type: string, example: USD}
                        leverage:    {type: integer, example: 100}
                  count: {type: integer, example: 1}

  /api/v1/public/demo-account:
    post:
      operationId: orrnnDemoAccountCreate
      tags: ["Orrnn Demo"]
      summary: Create a demo account on the orrnn broker (user-label frontend)
      description: |
        Creates a demo trading account under the centralized **orrnn** broker.
        No authentication required.

        Server enforces (and the client cannot override):
        - `broker_id` = `orrnn`
        - `created_by_type` = `user`
        - Only demo groups are accepted; a live group returns MT_RET_ERR_PERMISSIONS
        - Default `initial_balance` = 10,000 if not specified

        The account is created and a `login` number plus `api_key` are returned.
        `origin_broker` is stored as-is for analytics (which broker's frontend
        referred the user).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group, email, master_pass]
              properties:
                group:           {type: string, example: orrnn/demo-std, description: Demo group name (see GET /api/v1/public/demo-groups)}
                email:           {type: string, format: email, example: trader@example.com}
                master_pass:     {type: string, example: "Strong-Pass-123"}
                investor_pass:   {type: string, example: "Read-Only-Pass"}
                first_name:      {type: string, example: Jane}
                last_name:       {type: string, example: Doe}
                phone:           {type: string, example: "+1-555-0100"}
                country:         {type: string, example: US}
                currency:        {type: string, example: USD, default: USD}
                leverage:        {type: integer, example: 100, default: 100}
                initial_balance: {type: number, example: 10000, default: 10000}
                origin_broker:   {type: string, example: fxtrust, description: "Tracked only; the actual broker_id is always 'orrnn'."}
                comment:         {type: string, example: "Public demo account"}
      responses:
        "200":
          description: Demo account created
          content:
            application/json:
              schema:
                type: object
                properties:
                  login:         {type: integer, format: int64, example: 900000001}
                  broker_id:     {type: string, example: orrnn}
                  group:         {type: string, example: orrnn/demo-std}
                  currency:      {type: string, example: USD}
                  leverage:      {type: integer, example: 100}
                  balance:       {type: number, example: 10000}
                  api_key:       {type: string, example: rtx5_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx}
                  master_pass:   {type: string, example: (hashed server-side)}
                  created_at:    {type: integer, format: int64}
        "201":
          description: Error (MT5-compatible ExceptionResult JSON — e.g. MT_RET_ERR_PERMISSIONS for live group, MT_RET_ERR_DATA for DB failure)

# =============================================================================
# COMPONENTS
# =============================================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from /api/v2/auth/login
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key obtained during registration
    AdminApiKey:
      type: apiKey
      in: header
      name: X-Admin-API-Key
      description: RTX5 admin API key for License Server operations

  schemas:
    # --- Common ---
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Invalid request parameters

    # --- Auth ---
    AuthTokenResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIs...
        refresh_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIs...
        api_key:
          type: string
          description: API key (only returned on registration)
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [user, manager, admin]
        enabled:
          type: boolean
        api_key:
          type: string
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64

    # --- Market Data ---
    Instrument:
      type: object
      properties:
        symbol:
          type: string
          example: EURUSD
        description:
          type: string
          example: Euro vs US Dollar
        category:
          type: string
          example: forex
        digits:
          type: integer
          example: 5
        contract_size:
          type: number
          format: double
          example: 100000
        min_volume:
          type: number
          format: double
          example: 0.01
        max_volume:
          type: number
          format: double
          example: 100.0
        volume_step:
          type: number
          format: double
          example: 0.01
        spread:
          type: number
          format: double
          example: 1.2
        swap_long:
          type: number
          format: double
          example: -0.5
        swap_short:
          type: number
          format: double
          example: 0.3
        commission:
          type: number
          format: double
          example: 7.0
        enabled:
          type: boolean
          example: true

    InstrumentCreate:
      type: object
      required: [symbol, category, digits, contract_size]
      properties:
        symbol:
          type: string
        description:
          type: string
        category:
          type: string
        digits:
          type: integer
        contract_size:
          type: number
          format: double
        min_volume:
          type: number
          format: double
        max_volume:
          type: number
          format: double
        volume_step:
          type: number
          format: double
        spread:
          type: number
          format: double
        swap_long:
          type: number
          format: double
        swap_short:
          type: number
          format: double
        commission:
          type: number
          format: double
        enabled:
          type: boolean

    Tick:
      type: object
