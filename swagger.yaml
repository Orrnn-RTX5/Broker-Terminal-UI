          format: int64
        ticks_received:
          type: integer
          format: int64
        last_tick_at:
          type: integer
          format: int64

    # --- News ---
    NewsItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          example: Fed Holds Rates Steady
        summary:
          type: string
        source:
          type: string
          example: Reuters
        url:
          type: string
          format: uri
        symbols:
          type: array
          items:
            type: string
        impact:
          type: string
          enum: [low, medium, high]
        published_at:
          type: integer
          format: int64

    EconomicEvent:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          example: US Non-Farm Payrolls
        country:
          type: string
          example: US
        currency:
          type: string
          example: USD
        impact:
          type: string
          enum: [low, medium, high]
        forecast:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
        actual:
          type: string
          nullable: true
        event_at:
          type: integer
          format: int64

    # --- History Backend ---
    HistoryCandle:
      type: object
      properties:
        time:
          type: integer
          format: int64
          description: Unix timestamp of candle open
        open:
          type: number
          format: double
        high:
          type: number
          format: double
        low:
          type: number
          format: double
        close:
          type: number
          format: double
        tick_count:
          type: integer

    HistoryTick:
      type: object
      properties:
        symbol:
          type: string
        bid:
          type: number
          format: double
        ask:
          type: number
          format: double
        time:
          type: integer
          format: int64

    HistoryStats:
      type: object
      properties:
        symbol:
          type: string
        earliest_tick:
          type: integer
          format: int64
        latest_tick:
          type: integer
          format: int64
        total_ticks:
          type: integer
          format: int64
        earliest_candle_m1:
          type: integer
          format: int64

    # --- Logging Backend ---
    AuditEvent:
      type: object
      properties:
        id:
          type: integer
          format: int64
        broker_id:
          type: integer
        timestamp:
          type: integer
          format: int64
        timestamp_unix:
          type: integer
          format: int64
        service:
          type: string
          example: rtx5-core
        action:
          type: string
          example: order_fill
        actor_type:
          type: string
          enum: [trader, manager, system, api_key]
        actor_id:
          type: string
        actor_ip:
          type: string
        target_type:
          type: string
          enum: [account, position, order, deal]
        target_id:
          type: integer
          format: int64
        before_state:
          type: object
        after_state:
          type: object
        metadata:
          type: object
        result:
          type: string
          enum: [success, failure, rejected]
        error_code:
          type: string
        session_id:
          type: string
        request_id:
          type: string
          format: uuid

    LatencyMetrics:
      type: object
      properties:
        p50:
          type: number
          format: double
        p95:
          type: number
          format: double
        p99:
          type: number
          format: double
        avg:
          type: number
          format: double
        count:
          type: integer

    VolumeMetric:
      type: object
      properties:
        period:
          type: string
          description: Period start (e.g. "2024-11-14" for day)
        trade_count:
          type: integer
        total_volume:
          type: number
          format: double

    # --- License Server ---
    License:
      type: object
      properties:
        id:
          type: integer
          format: int64
        license_key:
          type: string
          format: uuid
        broker_name:
          type: string
        broker_id:
          type: integer
        plan:
          type: string
          enum: [starter, growth, enterprise]
        status:
          type: string
          enum: [active, suspended, expired, grace_period]
        max_accounts:
          type: integer
          description: "-1 = unlimited"
        max_instruments:
          type: integer
        max_managers:
          type: integer
        modules_enabled:
          type: array
          items:
            type: string
        issued_at:
          type: integer
          format: int64
        valid_from:
          type: integer
          format: int64
        valid_until:
          type: integer
          format: int64
          nullable: true
        grace_period_days:
          type: integer
        contact_email:
          type: string
          format: email
        contact_name:
          type: string
        billing_model:
          type: string
          enum: [flat_monthly, per_account, volume_based]
        base_price_usd:
          type: number
          format: double
        per_account_usd:
          type: number
          format: double
        last_heartbeat:
          type: integer
          format: int64
        current_accounts:
          type: integer
        current_active_accounts:
          type: integer
        total_deals_lifetime:
          type: integer
          format: int64
        total_volume_lifetime:
          type: number
          format: double

    LicenseCreateRequest:
      type: object
      required: [broker_name, broker_id, plan, contact_email, billing_model]
      properties:
        broker_name:
          type: string
        broker_id:
          type: integer
        plan:
          type: string
          enum: [starter, growth, enterprise]
        max_accounts:
          type: integer
          description: Override default for plan
        max_instruments:
          type: integer
        max_managers:
          type: integer
        modules_enabled:
          type: array
          items:
            type: string
        contact_email:
          type: string
          format: email
        contact_name:
          type: string
        billing_model:
          type: string
          enum: [flat_monthly, per_account, volume_based]
        base_price_usd:
          type: number
        per_account_usd:
          type: number
        valid_from:
          type: integer
          format: int64
        valid_until:
          type: integer
          format: int64
          nullable: true
        grace_period_days:
          type: integer
          default: 7

    LicenseUpdateRequest:
      type: object
      properties:
        plan:
          type: string
          enum: [starter, growth, enterprise]
        max_accounts:
          type: integer
        max_instruments:
          type: integer
        max_managers:
          type: integer
        modules_enabled:
          type: array
          items:
            type: string
        billing_model:
          type: string
        base_price_usd:
          type: number
        per_account_usd:
          type: number
        valid_until:
          type: integer
          format: int64

    HeartbeatRequest:
      type: object
      required: [license_key, broker_id, accounts, active_accounts, deals, volume]
      properties:
        license_key:
          type: string
          format: uuid
        broker_id:
          type: integer
        accounts:
          type: integer
        active_accounts:
          type: integer
        deals:
          type: integer
          format: int64
        volume:
          type: number
          format: double
        server_version:
          type: string

    HeartbeatRecord:
      type: object
      properties:
        id:
          type: integer
          format: int64
        license_key:
          type: string
        broker_id:
          type: integer
        reported_accounts:
          type: integer
        reported_active_accounts:
          type: integer
        reported_deals:
          type: integer
          format: int64
        reported_volume:
          type: number
          format: double
        server_version:
          type: string
        ip:
          type: string
        timestamp:
          type: integer
          format: int64

    BrokerUsage:
      type: object
      properties:
        broker_id:
          type: integer
        broker_name:
          type: string
        plan:
          type: string
        current_accounts:
          type: integer
        current_active_accounts:
          type: integer
        total_deals_lifetime:
          type: integer
          format: int64
        total_volume_lifetime:
          type: number
          format: double
        last_heartbeat:
          type: integer
          format: int64

    DashboardStats:
      type: object
      properties:
        total_brokers:
          type: integer
        total_accounts:
          type: integer
        total_volume:
          type: number
          format: double
        mrr:
          type: number
          format: double
          description: Monthly Recurring Revenue in USD

    LicenseSummary:
      type: object
      properties:
        status:
          type: string
          enum: [active, suspended, expired, grace_period]
        max_accounts:
          type: integer
        modules_enabled:
          type: array
          items:
            type: string
        valid_until:
          type: integer
          format: int64
          nullable: true

    # --- License Agent ---
    LicenseAgentStatus:
      type: object
      properties:
        status:
          type: string
          enum: [active, suspended, expired, grace_period]
        plan:
          type: string
        broker_id:
          type: integer
        broker_name:
          type: string
        max_accounts:
          type: integer
        current_accounts:
          type: integer
        max_instruments:
          type: integer
        max_managers:
          type: integer
        modules_enabled:
          type: array
          items:
            type: string
        valid_until:
          type: integer
          format: int64
          nullable: true

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
