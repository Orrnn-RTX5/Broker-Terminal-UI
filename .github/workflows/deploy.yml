name: Deploy RTX5 Web Terminal

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-push-deploy:
    name: Build, push, and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:web

      - name: Resolve image name
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ github.token }}

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: |
            VITE_MODE=web
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Deploy via broker infra script
        shell: bash
        env:
          INFRA_REPO: ${{ github.repository_owner }}/ORRNN-RTX5-Broker-Infra
          INFRA_TOKEN: ${{ secrets.INFRA_REPO_DISPATCH_TOKEN }}
          BROKER_IDS: "achiever-financials"
          COMPONENT: webterminal
          IMAGE_REF: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          SHARED_DISCOVERY_BASE_URL: "https://superbackend.orrnn.com"
          # Achiever-only: prefer Achiever identity secret (same as backend Deploy Brokers).
          BROKER_SSH_PRIVATE_KEY: ${{ secrets.BROKER_SSH_KNOWN_HOSTS_ACHIEVER || secrets.BROKER_SSH_PRIVATE_KEY }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
          GHCR_TOKEN: ${{ github.token }}
          LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
        run: |
          set -euo pipefail
          if [[ -z "$INFRA_TOKEN" ]]; then
            echo "INFRA_REPO_DISPATCH_TOKEN is required to read $INFRA_REPO" >&2
            exit 1
          fi
          if [[ -z "$BROKER_SSH_PRIVATE_KEY" ]]; then
            echo "BROKER_SSH_KNOWN_HOSTS_ACHIEVER (or BROKER_SSH_PRIVATE_KEY) is required for Achiever SSH deploy" >&2
            exit 1
          fi
          echo "SSH identity: Achiever deploy key (BROKER_SSH_KNOWN_HOSTS_ACHIEVER preferred)"

          api_get() {
            curl --fail-with-body -sSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $INFRA_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$INFRA_REPO/contents/$1?ref=main"
          }

          api_get brokers.json | jq -r '.content' | base64 -d > /tmp/brokers.json
          api_get scripts/deploy-broker.sh | jq -r '.content' | base64 -d > /tmp/deploy-broker.sh
          chmod +x /tmp/deploy-broker.sh

          install -m 700 -d ~/.ssh
          printf '%s\n' "$BROKER_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          for broker_id in $BROKER_IDS; do
            echo "Deploying $COMPONENT to broker=$broker_id"
            broker="$(jq -c --arg broker_id "$broker_id" '.brokers[] | select(.id == $broker_id and .enabled == true)' /tmp/brokers.json)"
            if [[ -z "$broker" ]]; then
              echo "Broker '$broker_id' is missing or disabled in $INFRA_REPO/brokers.json" >&2
              exit 1
            fi
            broker="$(jq -c --arg discovery_base_url "$SHARED_DISCOVERY_BASE_URL" '.env = (.env // {}) | .env.DISCOVERY_BASE_URL = $discovery_base_url | .env.VITE_DISCOVERY_BASE_URL = $discovery_base_url | .env.VITE_BROKER_DISCOVERY_URL = $discovery_base_url' <<<"$broker")"

            host="$(jq -r '.ssh.host' <<<"$broker")"
            user="$(jq -r '.ssh.user // "root"' <<<"$broker")"
            port="$(jq -r '.ssh.port // 22' <<<"$broker")"
            broker_b64="$(printf '%s' "$broker" | base64 -w0)"

            ssh_opts=(-i ~/.ssh/deploy_key -p "$port" -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30)
            scp_opts=(-i ~/.ssh/deploy_key -P "$port" -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30)
            ssh "${ssh_opts[@]}" "$user@$host" "mkdir -p /opt/rtx5-infra/scripts"
            scp "${scp_opts[@]}" /tmp/deploy-broker.sh "$user@$host:/opt/rtx5-infra/scripts/deploy-broker.sh"
            ssh "${ssh_opts[@]}" "$user@$host" \
              "chmod +x /opt/rtx5-infra/scripts/deploy-broker.sh && BROKER_JSON_B64='$broker_b64' COMPONENT='$COMPONENT' IMAGE_REF='$IMAGE_REF' DRY_RUN='false' GHCR_USERNAME='$GHCR_USERNAME' GHCR_TOKEN='$GHCR_TOKEN' LETSENCRYPT_EMAIL='$LETSENCRYPT_EMAIL' /opt/rtx5-infra/scripts/deploy-broker.sh"
          done
