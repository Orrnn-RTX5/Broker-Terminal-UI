name: Deploy RTX5 Web Terminal

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: webterminal-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/broker-terminal-ui

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: |
            VITE_MODE=web
          cache-from: type=gha,scope=web-runtime
          cache-to: type=gha,scope=web-runtime,mode=min
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

  deploy:
    name: Deploy Container to Server
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Execute deployment via SSH
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER || 'ubuntu' }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY || secrets.BROKER_SSH_PRIVATE_KEY }}
          IMAGE_TAG: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          IMAGE_LATEST: ${{ env.IMAGE_NAME }}:latest
          GHCR_USER: ${{ secrets.GHCR_USERNAME || github.actor }}
          GHCR_PASS: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          ENV_FILE: ${{ secrets.PROD_ENV_FILE || secrets.ENV_FILE }}
          WEB_BROKER_ID: ${{ vars.WEB_BROKER_ID }}
          WEB_FEED_BROKER_ID: ${{ vars.WEB_FEED_BROKER_ID }}
          DEPLOY_DIR: /opt/Rtx5-broker-production/terminal-ui
        run: |
          set -euo pipefail

          # Optional public identity settings override legacy env-file values.
          # IDs are supplied by backend provisioning, never inferred or renamed.
          for broker_identity in "${WEB_BROKER_ID:-}" "${WEB_FEED_BROKER_ID:-}"; do
            if [ -n "$broker_identity" ] && [[ ! "$broker_identity" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "ERROR: Configured broker identity has invalid characters." >&2
              exit 1
            fi
          done

          if [ -z "$SERVER_HOST" ]; then
            echo "ERROR: SERVER_HOST repository secret is not set!" >&2
            exit 1
          fi

          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "ERROR: SERVER_SSH_KEY (or BROKER_SSH_PRIVATE_KEY) secret is not set!" >&2
            echo "Please configure SERVER_SSH_KEY in repository Secrets." >&2
            exit 1
          fi

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          SSH_OPTS=(-i ~/.ssh/deploy_key -p "$SERVER_PORT" -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30)

          echo "Connecting to $SERVER_USER@$SERVER_HOST:$SERVER_PORT..."

          # Write entire environment file if PROD_ENV_FILE secret is provided
          if [ -n "${ENV_FILE:-}" ]; then
            echo "Writing environment configuration to ${DEPLOY_DIR}/.env on server..."
            printf '%s\n' "$ENV_FILE" | ssh "${SSH_OPTS[@]}" "$SERVER_USER@$SERVER_HOST" "sudo mkdir -p ${DEPLOY_DIR} && sudo tee ${DEPLOY_DIR}/.env > /dev/null && sudo chown \"\$(id -u)\":\"\$(id -g)\" ${DEPLOY_DIR}/.env && sudo chmod 600 ${DEPLOY_DIR}/.env"
          fi

          # Send the registry password over SSH stdin. It never becomes part of
          # the remote command line or executable shell source.
          if [ -n "$GHCR_USER" ] && [ -n "$GHCR_PASS" ]; then
            printf -v GHCR_USER_SHELL '%q' "$GHCR_USER"
            printf '%s' "$GHCR_PASS" | ssh "${SSH_OPTS[@]}" "$SERVER_USER@$SERVER_HOST" \
              "docker login ghcr.io -u $GHCR_USER_SHELL --password-stdin"
          fi

          ssh "${SSH_OPTS[@]}" "$SERVER_USER@$SERVER_HOST" \
            "IMAGE_TAG='$IMAGE_TAG' IMAGE_LATEST='$IMAGE_LATEST' DEPLOY_DIR='$DEPLOY_DIR' WEB_BROKER_ID='$WEB_BROKER_ID' WEB_FEED_BROKER_ID='$WEB_FEED_BROKER_ID' bash -s" <<'EOF'
            set -euo pipefail

            echo "=== 1. Pulling image: $IMAGE_TAG ==="
            docker pull "$IMAGE_TAG"
            docker tag "$IMAGE_TAG" "$IMAGE_LATEST"

            echo "=== 2. Ensuring directory exists ==="
            sudo mkdir -p ${DEPLOY_DIR} || true

            # Record the immutable local image ID. The old container may have
            # been created from the mutable latest tag, which is retagged above.
            PREV_IMAGE_ID=$(docker inspect --format='{{.Image}}' broker-terminal-ui 2>/dev/null || echo "")
            PREV_IMAGE_REF=$(docker inspect --format='{{.Config.Image}}' broker-terminal-ui 2>/dev/null || echo "")
            echo "Previous container image: ${PREV_IMAGE_REF:-None} (${PREV_IMAGE_ID:-no immutable ID})"

            echo "=== 3. Recreating container on port 127.0.0.1:8103 ==="
            ENV_ARG=""
            if [ -f ${DEPLOY_DIR}/.env ]; then
              if [ -r ${DEPLOY_DIR}/.env ]; then
                ENV_ARG="--env-file ${DEPLOY_DIR}/.env"
              else
                echo "ERROR: ${DEPLOY_DIR}/.env exists but is not readable by $(id -un); docker run would fail." >&2
                ls -l ${DEPLOY_DIR}/.env >&2 || true
                exit 1
              fi
            else
              echo "ERROR: A complete per-broker runtime environment is required at ${DEPLOY_DIR}/.env." >&2
              exit 1
            fi

            BROKER_ENV_OVERRIDES=()
            if [ -n "${WEB_BROKER_ID:-}" ]; then
              BROKER_ENV_OVERRIDES+=(-e "BROKER_ID=$WEB_BROKER_ID" -e "VITE_BROKER_ID=$WEB_BROKER_ID")
            fi
            if [ -n "${WEB_FEED_BROKER_ID:-}" ]; then
              BROKER_ENV_OVERRIDES+=(-e "FEED_BROKER_ID=$WEB_FEED_BROKER_ID" -e "VITE_FEED_BROKER_ID=$WEB_FEED_BROKER_ID")
            fi

            run_terminal_image() {
              docker run -d \
                --name broker-terminal-ui \
                --restart unless-stopped \
                -p 127.0.0.1:8103:80 \
                $ENV_ARG \
                "${BROKER_ENV_OVERRIDES[@]}" \
                --label "rtx5.component=webterminal" \
                "$1"
            }

            docker rm -f broker-terminal-ui 2>/dev/null || true
            if ! run_terminal_image "$IMAGE_TAG"; then
              echo "CRITICAL: New container failed to start. Restoring: ${PREV_IMAGE_ID:-None}" >&2
              if [ -n "$PREV_IMAGE_ID" ]; then
                run_terminal_image "$PREV_IMAGE_ID"
                echo "Rollback completed: previous image restarted."
              fi
              exit 1
            fi

            echo "=== 4. Verifying container health with Auto-Rollback Guard ==="
            SUCCESS=0
            for i in $(seq 1 10); do
              sleep 1
              HTTP_STATUS=$(curl --silent --show-error --connect-timeout 2 --max-time 5 --output /dev/null --write-out "%{http_code}" http://127.0.0.1:8103/ || true)
              if [ "$HTTP_STATUS" = "200" ]; then
                echo "WebTerminal container healthy (HTTP 200) on attempt $i."
                SUCCESS=1
                break
              fi
              echo "Waiting for WebTerminal to respond (attempt $i/10)."
            done

            if [ "$SUCCESS" -ne 1 ]; then
              echo "CRITICAL: Health check failed. Initiating rollback to: ${PREV_IMAGE_ID:-None}" >&2
              docker logs --tail 50 broker-terminal-ui || true
              docker rm -f broker-terminal-ui 2>/dev/null || true
              if [ -n "$PREV_IMAGE_ID" ]; then
                run_terminal_image "$PREV_IMAGE_ID"
                echo "Rollback completed: previous known-good container restored."
              fi
              exit 1
            fi
            docker inspect --format='Container {{.Name}}: {{.State.Status}}, image {{.Image}}' broker-terminal-ui

            echo "=== 5. Updating additional provisioned WebTerminal containers (if any) ==="
            EXTRA_CONTAINERS=$(
              {
                docker ps --filter "label=rtx5.broker_id" --format '{{.Names}}' 2>/dev/null || true
                docker ps --filter "label=rtx5.component=webterminal" --format '{{.Names}}' 2>/dev/null || true
                docker ps --format '{{.Names}}' 2>/dev/null | grep -E '^rtx5-webterminal-' || true
              } | sort -u | grep -v '^broker-terminal-ui$' || true
            )

            for EXTRA_NAME in $EXTRA_CONTAINERS; do
              [ -n "$EXTRA_NAME" ] || continue
              PREV_EXTRA_IMAGE_ID=$(docker inspect --format='{{.Image}}' "$EXTRA_NAME" 2>/dev/null || echo "")
              HOST_IP=$(docker inspect --format='{{ with index .HostConfig.PortBindings "80/tcp" }}{{ (index . 0).HostIp }}{{ end }}' "$EXTRA_NAME" 2>/dev/null || echo "")
              HOST_PORT=$(docker inspect --format='{{ with index .HostConfig.PortBindings "80/tcp" }}{{ (index . 0).HostPort }}{{ end }}' "$EXTRA_NAME" 2>/dev/null || echo "")
              if [ -z "$HOST_PORT" ]; then
                echo "Skipping $EXTRA_NAME (no 80/tcp host port binding found)."
                continue
              fi
              [ -n "$HOST_IP" ] || HOST_IP="127.0.0.1"

              BROKER_LABEL=$(docker inspect --format='{{ index .Config.Labels "rtx5.broker_id" }}' "$EXTRA_NAME" 2>/dev/null || echo "")
              DOMAIN_LABEL=$(docker inspect --format='{{ index .Config.Labels "rtx5.domain" }}' "$EXTRA_NAME" 2>/dev/null || echo "")
              COMPONENT_LABEL=$(docker inspect --format='{{ index .Config.Labels "rtx5.component" }}' "$EXTRA_NAME" 2>/dev/null || echo "")

              EXTRA_ENV_TMP=$(mktemp)
              chmod 600 "$EXTRA_ENV_TMP"
              if [ -n "$BROKER_LABEL" ] && sudo test -r "/etc/rtx5/env/${BROKER_LABEL}.env" 2>/dev/null; then
                sudo cat "/etc/rtx5/env/${BROKER_LABEL}.env" > "$EXTRA_ENV_TMP"
              else
                docker inspect --format='{{range .Config.Env}}{{println .}}{{end}}' "$EXTRA_NAME" \
                  | grep -Ev '^(PATH|NGINX_VERSION|NJS_VERSION|NJS_RELEASE|PKG_RELEASE|DYNPKG_RELEASE)=' > "$EXTRA_ENV_TMP" || true
              fi

              EXTRA_LABELS=(--label "rtx5.component=${COMPONENT_LABEL:-webterminal}")
              if [ -n "$BROKER_LABEL" ] && [ "$BROKER_LABEL" != "<no value>" ]; then
                EXTRA_LABELS+=(--label "rtx5.broker_id=${BROKER_LABEL}")
              fi
              if [ -n "$DOMAIN_LABEL" ] && [ "$DOMAIN_LABEL" != "<no value>" ]; then
                EXTRA_LABELS+=(--label "rtx5.domain=${DOMAIN_LABEL}")
              fi

              run_extra_terminal() {
                docker run -d \
                  --name "$EXTRA_NAME" \
                  --restart unless-stopped \
                  -p "${HOST_IP}:${HOST_PORT}:80" \
                  --env-file "$EXTRA_ENV_TMP" \
                  "${EXTRA_LABELS[@]}" \
                  "$1"
              }

              echo "Updating container $EXTRA_NAME on ${HOST_IP}:${HOST_PORT}..."
              docker rm -f "$EXTRA_NAME" 2>/dev/null || true
              if ! run_extra_terminal "$IMAGE_TAG"; then
                echo "WARNING: Failed to start updated $EXTRA_NAME; restoring $PREV_EXTRA_IMAGE_ID" >&2
                if [ -n "$PREV_EXTRA_IMAGE_ID" ]; then
                  run_extra_terminal "$PREV_EXTRA_IMAGE_ID" || true
                fi
                rm -f "$EXTRA_ENV_TMP"
                exit 1
              fi

              EXTRA_OK=0
              for attempt in $(seq 1 10); do
                sleep 1
                EXTRA_HTTP=$(curl --silent --show-error --connect-timeout 2 --max-time 5 --output /dev/null --write-out "%{http_code}" "http://127.0.0.1:${HOST_PORT}/" || true)
                if [ "$EXTRA_HTTP" = "200" ]; then
                  echo "Container $EXTRA_NAME healthy (HTTP 200) on attempt $attempt."
                  EXTRA_OK=1
                  break
                fi
              done

              if [ "$EXTRA_OK" -ne 1 ]; then
                echo "CRITICAL: Health check failed for $EXTRA_NAME; restoring $PREV_EXTRA_IMAGE_ID" >&2
                docker logs --tail 50 "$EXTRA_NAME" || true
                docker rm -f "$EXTRA_NAME" 2>/dev/null || true
                if [ -n "$PREV_EXTRA_IMAGE_ID" ]; then
                  run_extra_terminal "$PREV_EXTRA_IMAGE_ID" || true
                fi
                rm -f "$EXTRA_ENV_TMP"
                exit 1
              fi
              rm -f "$EXTRA_ENV_TMP"
              docker inspect --format='Container {{.Name}}: {{.State.Status}}, image {{.Image}}' "$EXTRA_NAME"
            done

            echo "Deployment successful and verified."
          EOF
