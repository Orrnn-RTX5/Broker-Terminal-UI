name: Deploy RTX5 Web Terminal

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: webterminal-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/broker-terminal-ui

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:web

      - name: Lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: |
            VITE_MODE=web
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

  deploy:
    name: Deploy Container to Server
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Execute deployment via SSH
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST || '51.195.188.172' }}
          SERVER_USER: ${{ secrets.SERVER_USER || 'ubuntu' }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY || secrets.BROKER_SSH_PRIVATE_KEY }}
          IMAGE_TAG: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          IMAGE_LATEST: ${{ env.IMAGE_NAME }}:latest
          GHCR_USER: ${{ secrets.GHCR_USERNAME || github.actor }}
          GHCR_PASS: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          ENV_FILE: ${{ secrets.PROD_ENV_FILE || secrets.ENV_FILE }}
        run: |
          set -euo pipefail

          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "ERROR: SERVER_SSH_KEY (or BROKER_SSH_PRIVATE_KEY) secret is not set!" >&2
            echo "Please configure SERVER_SSH_KEY in repository Secrets." >&2
            exit 1
          fi

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          SSH_OPTS=(-i ~/.ssh/deploy_key -p "$SERVER_PORT" -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30)

          echo "Connecting to $SERVER_USER@$SERVER_HOST:$SERVER_PORT..."

          # Write entire environment file if PROD_ENV_FILE secret is provided
          if [ -n "${ENV_FILE:-}" ]; then
            echo "Writing environment configuration to /opt/Webterminal/.env on server..."
            printf '%s\n' "$ENV_FILE" | ssh "${SSH_OPTS[@]}" "$SERVER_USER@$SERVER_HOST" "sudo mkdir -p /opt/Webterminal && sudo tee /opt/Webterminal/.env > /dev/null && sudo chmod 600 /opt/Webterminal/.env"
          fi

          ssh "${SSH_OPTS[@]}" "$SERVER_USER@$SERVER_HOST" bash -s <<EOF
            set -euo pipefail

            echo "=== 1. Logging into GHCR ==="
            if [ -n "$GHCR_USER" ] && [ -n "$GHCR_PASS" ]; then
              printf '%s' "$GHCR_PASS" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            fi

            echo "=== 2. Pulling image: $IMAGE_TAG ==="
            docker pull "$IMAGE_TAG"
            docker tag "$IMAGE_TAG" "$IMAGE_LATEST"

            echo "=== 3. Ensuring directory exists ==="
            sudo mkdir -p /opt/Webterminal || true

            # Record previous running image for instant auto-rollback if new version fails
            PREV_IMAGE=\$(docker inspect --format='{{.Config.Image}}' broker-terminal-ui 2>/dev/null || echo "")
            echo "ℹ️ Active previous container image: \${PREV_IMAGE:-None}"

            echo "=== 4. Recreating container on port 127.0.0.1:8103 ==="
            docker rm -f broker-terminal-ui 2>/dev/null || true

            ENV_ARG=""
            if [ -f /opt/Webterminal/.env ]; then
              ENV_ARG="--env-file /opt/Webterminal/.env"
            fi

            docker run -d \
              --name broker-terminal-ui \
              --restart unless-stopped \
              -p 127.0.0.1:8103:80 \
              \$ENV_ARG \
              --label "rtx5.component=webterminal" \
              --label "rtx5.domain=webterminal.orrnn.com" \
              "$IMAGE_LATEST"

            echo "=== 5. Verifying container health with Auto-Rollback Guard ==="
            SUCCESS=0
            for i in \$(seq 1 10); do
              sleep 1
              if curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8103/ | grep -q "200"; then
                echo "✅ WebTerminal container healthy (HTTP 200) on attempt \$i!"
                SUCCESS=1
                break
              fi
              echo "⏳ Waiting for WebTerminal to respond... (Attempt \$i/10)"
            done

            if [ "\$SUCCESS" -ne 1 ]; then
              echo "❌ CRITICAL: Health check failed! Initiating automatic rollback to: \${PREV_IMAGE:-None}" >&2
              docker logs --tail 50 broker-terminal-ui || true
              if [ -n "\$PREV_IMAGE" ]; then
                docker rm -f broker-terminal-ui 2>/dev/null || true
                docker run -d \
                  --name broker-terminal-ui \
                  --restart unless-stopped \
                  -p 127.0.0.1:8103:80 \
                  \$ENV_ARG \
                  --label "rtx5.component=webterminal" \
                  "\$PREV_IMAGE"
                echo "⚠️ Rollback completed: previous known-good container restored."
              fi
              exit 1
            fi
            echo "🎉 Deployment successful and verified!"
          EOF
