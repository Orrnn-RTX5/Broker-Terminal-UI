name: Electron Desktop Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version already present in package.json, for example 1.0.17"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-windows:
    name: Build and publish Windows release
    runs-on: windows-latest

    env:
      RELEASE_REPOSITORY: rtx5-orrnn/rtx5-terminal-releases
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm.cmd ci

      - name: Validate release inputs
        shell: pwsh
        env:
          RELEASE_GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_GH_TOKEN)) {
            throw "RELEASE_GH_TOKEN repository secret is required in the private source repo."
          }

          $version = "${{ inputs.version }}"
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Invalid release version: $version"
          }

          $package = Get-Content package.json -Raw | ConvertFrom-Json
          if ($package.version -ne $version) {
            throw "package.json version '$($package.version)' does not match requested release '$version'."
          }

          $publish = $package.build.publish
          if ($publish.provider -ne "github" -or $publish.owner -ne "rtx5-orrnn" -or $publish.repo -ne "rtx5-terminal-releases" -or $publish.private -ne $false) {
            throw "Electron publish config must target public repo rtx5-orrnn/rtx5-terminal-releases."
          }

      - name: Typecheck
        run: npm.cmd run typecheck

      - name: Test
        run: npm.cmd run test:run

      - name: Initialize public release repository if empty
        shell: pwsh
        env:
          RELEASE_GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
        run: |
          $releaseRepoUrl = "https://x-access-token:$env:RELEASE_GH_TOKEN@github.com/$env:RELEASE_REPOSITORY.git"
          $heads = git ls-remote --heads $releaseRepoUrl
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to access release repository $env:RELEASE_REPOSITORY with RELEASE_GH_TOKEN."
          }

          if (-not [string]::IsNullOrWhiteSpace($heads)) {
            Write-Host "Release repository already has branches; skipping initialization."
            exit 0
          }

          Write-Host "Release repository is empty; creating initial README commit."
          $releaseDir = Join-Path $env:RUNNER_TEMP "rtx5-terminal-releases"
          if (Test-Path $releaseDir) {
            Remove-Item -Recurse -Force $releaseDir
          }

          git clone --quiet $releaseRepoUrl $releaseDir
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to clone empty release repository."
          }

          Push-Location $releaseDir
          try {
            git checkout -b main
            @(
              "# RTX Terminal Releases"
              ""
              "Public Electron auto-update release assets for RTX Terminal."
              ""
              "The source code lives in the private rtx5-orrnn/rtx5-broker-webterminal-ui repository."
            ) | Set-Content -Path README.md -Encoding utf8

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "Initialize release repository"
            git push --quiet origin main
          } finally {
            Pop-Location
          }

      - name: Build and publish Electron release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
        run: npm.cmd run electron:publish
