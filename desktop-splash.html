<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'" />
  <title>RTX Terminal</title>
  <style>
    :root { color-scheme: dark; background: transparent; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: transparent; }
    .desktop-splash {
      width: 100%; height: 100%; display: grid; place-items: center;
      background: #2d2c31; -webkit-app-region: drag;
    }
    img {
      display: block;
      width: clamp(200px, 28vmin, 300px);
      height: auto;
      aspect-ratio: 1;
      object-fit: contain;
      border-radius: 20%;
      animation: logo-appear 320ms cubic-bezier(0.16, 1, 0.3, 1) both;
      user-select: none;
      -webkit-user-drag: none;
    }
    @keyframes logo-appear {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) { img { animation: none; } }
  </style>
</head>
<body role="status" aria-label="Opening RTX Terminal" aria-busy="true">
  <div class="desktop-splash">
    <img src="./dist/brand/rtx5-app-icon.png" alt="RTX5" width="300" height="300" />
  </div>
</body>
</html>
