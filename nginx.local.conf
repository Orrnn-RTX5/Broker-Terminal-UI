server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

  # The local web preview talks to the native gateway through Docker Desktop's
  # host bridge. Requests remain same-origin in the browser, so the auth header
  # is forwarded without weakening the gateway's authentication policy.
  location /api/ {
    proxy_pass http://host.docker.internal:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
  }

  location /history/ {
    proxy_pass http://host.docker.internal:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
  }

  location /ws/ {
    proxy_pass http://host.docker.internal:8090;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri =404;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri =404;
  }

  location = /runtime-config.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri @asset_missing;
  }

  location ~ ^/(brand|login)/ {
    add_header Cache-Control "public, max-age=3600, stale-while-revalidate=2592000" always;
    try_files $uri @asset_missing;
  }

  location @asset_missing {
    add_header Cache-Control "no-store" always;
    return 404;
  }

  location / {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }
}
