services:
  broker-terminal-ui:
    image: ${WEB_TERMINAL_IMAGE:-ghcr.io/orrnn-rtx5/broker-terminal-ui:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_MODE: web
    container_name: ${WEB_TERMINAL_CONTAINER:-broker-terminal-ui}
    restart: unless-stopped
    ports:
      - "${WEB_TERMINAL_BIND:-127.0.0.1:8103}:80"
    # The same image reads one complete broker profile at container startup.
    # env_file forwards these settings; Compose interpolation alone does not.
    env_file:
      - ${BROKER_ENV_FILE:-.env}
    labels:
      - "rtx5.component=webterminal"
