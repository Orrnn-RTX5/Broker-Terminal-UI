<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../../src/index.css" />
  <style>
    :root {
      --bg-primary: #0a0b0e;
      --bg-secondary: #111216;
      --bg-tertiary: #17181e;
      --bg-card: #13141a;
      --border-subtle: #20222a;
      --border-strong: #2c2f3b;
      --text-primary: #f0f2f5;
      --text-secondary: #9499a8;
      --text-muted: #5e6475;
      --accent-blue: #0284c7;
      --color-profit: #10b981;
      --color-loss: #f43f5e;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #060709;
      padding: 24px;
      font-family: var(--font-sans);
      color: var(--text-primary);
    }

    .exposure-container {
      max-width: 1240px;
      margin: 0 auto;
      background: #0e0f13;
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 36px rgba(0,0,0,0.5);
      height: 340px;
    }

    .exposure-main {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    /* Left Table Area */
    .exposure-table-pane {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border-subtle);
    }

    .exposure-table-scroll {
      flex: 1;
      overflow: auto;
    }

    .exposure-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    .exposure-table th {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #090a0d;
      border-bottom: 1px solid var(--border-subtle);
      border-right: 1px solid rgba(255,255,255,0.03);
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-secondary);
    }

    .exposure-table th:last-child {
      border-right: 0;
      text-align: center;
    }

    .exposure-table td {
      padding: 7px 12px;
      font-size: 12.5px;
      border-bottom: 1px solid rgba(255,255,255,0.02);
      border-right: 1px solid rgba(255,255,255,0.02);
      white-space: nowrap;
    }

    .exposure-table td:last-child {
      border-right: 0;
    }

    .exposure-row:hover {
      background: rgba(255,255,255,0.03);
    }

    .exposure-asset-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .asset-icon-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
    }

    .asset-icon-usd {
      background: rgba(234, 179, 8, 0.15);
      border: 1px solid rgba(234, 179, 8, 0.4);
      color: #facc15;
    }

    .asset-icon-xau {
      background: rgba(245, 158, 11, 0.18);
      border: 1px solid rgba(245, 158, 11, 0.45);
      color: #fbbf24;
    }

    .asset-icon-forex {
      background: rgba(2, 132, 199, 0.15);
      border: 1px solid rgba(2, 132, 199, 0.4);
      color: #38bdf8;
    }

    .asset-icon-crypto {
      background: rgba(168, 85, 247, 0.15);
      border: 1px solid rgba(168, 85, 247, 0.4);
      color: #c084fc;
    }

    /* Bar Graph */
    .exposure-bar-track {
      height: 14px;
      background: #15171e;
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 3px;
      overflow: hidden;
      position: relative;
      width: 100%;
      min-width: 140px;
    }

    .exposure-bar-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.3s ease;
      position: relative;
    }

    .exposure-bar-fill.long {
      background: linear-gradient(90deg, #0284c7 0%, #38bdf8 100%);
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.25);
    }

    .exposure-bar-fill.short {
      background: linear-gradient(90deg, #e11d48 0%, #f43f5e 100%);
      box-shadow: 0 0 8px rgba(244, 63, 94, 0.25);
    }

    /* Bottom Status Metrics Bar */
    .exposure-status-bar {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 8px 14px;
      background: #090a0d;
      border-top: 1px solid var(--border-subtle);
      font-size: 11.5px;
      flex-shrink: 0;
      overflow-x: auto;
    }

    .metric-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .metric-group .label {
      color: var(--text-secondary);
      font-weight: 500;
    }

    .metric-group .value {
      font-family: var(--font-mono);
      font-weight: 600;
      color: #ffffff;
    }

    .margin-level-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 1px 6px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 600;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.25);
      color: #34d399;
    }

    .margin-level-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #34d399;
    }

    /* Right Panel (Donut Chart & Legend) */
    .exposure-chart-pane {
      width: 290px;
      background: #0b0c10;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      gap: 10px;
    }

    .chart-pane-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      padding-bottom: 8px;
    }

    .chart-pane-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
    }

    .chart-pane-tag {
      font-size: 10px;
      font-family: var(--font-mono);
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }

    .chart-area {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 140px;
    }

    .chart-center-label {
      position: absolute;
      text-align: center;
      pointer-events: none;
    }

    .chart-center-label span {
      display: block;
      font-size: 9px;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    .chart-center-label strong {
      font-size: 14px;
      font-family: var(--font-mono);
      font-weight: 700;
      color: #ffffff;
    }

    .exposure-legend {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: auto;
    }

    .legend-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      padding: 4px 6px;
      border-radius: 4px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.03);
    }

    .legend-item:hover {
      background: rgba(255,255,255,0.05);
    }

    .legend-item-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-color-dot {
      width: 8px;
      height: 8px;
      border-radius: 2px;
    }

    .legend-item-asset {
      font-weight: 600;
      color: #fff;
    }

    .legend-item-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .legend-item-pct {
      font-family: var(--font-mono);
      font-weight: 600;
      font-size: 11.5px;
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="exposure-container">
    <div class="exposure-main">
      <!-- Left Table -->
      <div class="exposure-table-pane">
        <div class="exposure-table-scroll">
          <table class="exposure-table">
            <thead>
              <tr>
                <th style="width: 140px;">Assets</th>
                <th style="width: 130px; text-align: right;">Volume</th>
                <th style="width: 130px; text-align: right;">Rate</th>
                <th style="width: 140px; text-align: right;">USD</th>
                <th>Graph</th>
              </tr>
            </thead>
            <tbody>
              <tr class="exposure-row">
                <td>
                  <div class="exposure-asset-badge">
                    <span class="asset-icon-pill asset-icon-usd">$</span>
                    <span style="color: #facc15;">USD</span>
                  </div>
                </td>
                <td style="text-align: right; font-family: var(--font-mono); font-weight: 500;">1.999M</td>
                <td style="text-align: right; font-family: var(--font-mono); color: var(--text-secondary);">1.00000</td>
                <td style="text-align: right; font-family: var(--font-mono); font-weight: 600; color: #fff;">1 999 286.84</td>
                <td>
                  <div class="exposure-bar-track">
                    <div class="exposure-bar-fill long" style="width: 99.98%;"></div>
                  </div>
                </td>
              </tr>
              <tr class="exposure-row">
                <td>
                  <div class="exposure-asset-badge">
                    <span class="asset-icon-pill asset-icon-xau">🪙</span>
                    <span style="color: #fbbf24;">XAU</span>
                  </div>
                </td>
                <td style="text-align: right; font-family: var(--font-mono); font-weight: 500;">32.00</td>
                <td style="text-align: right; font-family: var(--font-mono); color: var(--text-secondary);">4433.53000</td>
                <td style="text-align: right; font-family: var(--font-mono); font-weight: 600; color: #fff;">283.75</td>
                <td>
                  <div class="exposure-bar-track">
                    <div class="exposure-bar-fill long" style="width: 2.5%;"></div>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- Bottom Summary Bar -->
        <div class="exposure-status-bar">
          <div class="metric-group">
            <span class="label">Balance:</span>
            <span class="value">1 995 774.36 USD</span>
          </div>
          <span style="color: rgba(255,255,255,0.1);">•</span>
          <div class="metric-group">
            <span class="label">Equity:</span>
            <span class="value">1 999 854.34</span>
          </div>
          <span style="color: rgba(255,255,255,0.1);">•</span>
          <div class="metric-group">
            <span class="label">Margin:</span>
            <span class="value">283.75</span>
          </div>
          <span style="color: rgba(255,255,255,0.1);">•</span>
          <div class="metric-group">
            <span class="label">Free Margin:</span>
            <span class="value">1 999 570.59</span>
          </div>
          <span style="color: rgba(255,255,255,0.1);">•</span>
          <div class="metric-group">
            <span class="label">Margin Level:</span>
            <span class="value">704 790.31 %</span>
            <span class="margin-level-badge">
              <span class="margin-level-dot"></span>
              Healthy
            </span>
          </div>
        </div>
      </div>

      <!-- Right Donut Chart & Allocation -->
      <div class="exposure-chart-pane">
        <div class="chart-pane-header">
          <span class="chart-pane-title">Long Positions</span>
          <span class="chart-pane-tag">100% Long</span>
        </div>

        <!-- Donut Chart -->
        <div class="chart-area">
          <svg viewBox="0 0 160 140" width="160" height="140">
            <!-- Glow filter -->
            <filter id="donutGlow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.3" />
            </filter>
            
            <!-- USD Slice (99.98%) -->
            <circle cx="80" cy="70" r="48" fill="none" stroke="#0284c7" stroke-width="18" stroke-dasharray="301" stroke-dashoffset="0.5" filter="url(#donutGlow)" />
            <!-- XAU Slice (0.02%) -->
            <circle cx="80" cy="70" r="48" fill="none" stroke="#f59e0b" stroke-width="18" stroke-dasharray="301" stroke-dashoffset="300.5" />
          </svg>

          <div class="chart-center-label">
            <span>Primary</span>
            <strong>USD</strong>
          </div>
        </div>

        <!-- Legend breakdown -->
        <div class="exposure-legend">
          <div class="legend-item">
            <div class="legend-item-left">
              <span class="legend-color-dot" style="background: #0284c7;"></span>
              <span class="legend-item-asset">USD</span>
            </div>
            <div class="legend-item-right">
              <span style="color: var(--text-muted); font-size: 10.5px; font-family: var(--font-mono);">$1.99M</span>
              <span class="legend-item-pct">100.0%</span>
            </div>
          </div>

          <div class="legend-item">
            <div class="legend-item-left">
              <span class="legend-color-dot" style="background: #f59e0b;"></span>
              <span class="legend-item-asset">XAU</span>
            </div>
            <div class="legend-item-right">
              <span style="color: var(--text-muted); font-size: 10.5px; font-family: var(--font-mono);">$283.75</span>
              <span class="legend-item-pct" style="color: #fbbf24;">&lt; 0.1%</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
