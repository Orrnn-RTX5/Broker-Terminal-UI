<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Professional Trading Dashboard - Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      background: #0A0E14;
      color: #E6E9EF;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="loading">Loading Professional Trading Dashboard...</div>
  <script>
    // Redirect to the React app with a special route parameter
    setTimeout(() => {
      window.location.href = 'http://localhost:5174/?view=professional-dashboard';
    }, 500);
  </script>
</body>
</html>
