<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="913" viewBox="0 0 1100 913" role="img" aria-labelledby="title desc"><title id="title">RTX5 proposed light palette</title><desc id="desc">Color swatches for surfaces, text, interaction, trading and chart roles. Proposal only; not applied.</desc><g font-family="Segoe UI, Arial, sans-serif" fill="#111827"><rect width="1100" height="1000" fill="#FFFFFF"/><text x="36" y="44" font-size="27" font-weight="600">RTX5 proposed light palette</text><text x="36" y="74" font-size="15" fill="#4B5563">Research reference. These colors have not been applied to the terminal.</text><text x="36" y="115" font-size="19" font-weight="600">Surfaces and structure</text><rect x="36" y="135" width="48" height="48" fill="#F2F4F8" stroke="#7D8796"/><text x="99" y="154" font-size="15">Workspace / headers</text><text x="99" y="177" font-size="14" fill="#4B5563">#F2F4F8</text><rect x="381" y="135" width="48" height="48" fill="#FAFAFA" stroke="#7D8796"/><text x="444" y="154" font-size="15">Data panels</text><text x="444" y="177" font-size="14" fill="#4B5563">#FAFAFA</text><rect x="726" y="135" width="48" height="48" fill="#F7F7F7" stroke="#7D8796"/><text x="789" y="154" font-size="15">Chart background</text><text x="789" y="177" font-size="14" fill="#4B5563">#F7F7F7</text><rect x="36" y="207" width="48" height="48" fill="#FFFFFF" stroke="#7D8796"/><text x="99" y="226" font-size="15">Dialogs / menus</text><text x="99" y="249" font-size="14" fill="#4B5563">#FFFFFF</text><rect x="381" y="207" width="48" height="48" fill="#F2F6FC" stroke="#7D8796"/><text x="444" y="226" font-size="15">Input fill</text><text x="444" y="249" font-size="14" fill="#4B5563">#F2F6FC</text><rect x="726" y="207" width="48" height="48" fill="#EEF2FF" stroke="#7D8796"/><text x="789" y="226" font-size="15">Selected surface</text><text x="789" y="249" font-size="14" fill="#4B5563">#EEF2FF</text><rect x="36" y="279" width="48" height="48" fill="#E3E8F0" stroke="#7D8796"/><text x="99" y="298" font-size="15">Structural border</text><text x="99" y="321" font-size="14" fill="#4B5563">#E3E8F0</text><rect x="381" y="279" width="48" height="48" fill="#7D8796" stroke="#7D8796"/><text x="444" y="298" font-size="15">Control boundary</text><text x="444" y="321" font-size="14" fill="#4B5563">#7D8796</text><rect x="726" y="279" width="48" height="48" fill="#E8ECF2" stroke="#7D8796"/><text x="789" y="298" font-size="15">Pressed surface</text><text x="789" y="321" font-size="14" fill="#4B5563">#E8ECF2</text><text x="36" y="380" font-size="19" font-weight="600">Text and interaction</text><rect x="36" y="400" width="48" height="48" fill="#111827" stroke="#7D8796"/><text x="99" y="419" font-size="15">Primary text</text><text x="99" y="442" font-size="14" fill="#4B5563">#111827</text><rect x="381" y="400" width="48" height="48" fill="#4B5563" stroke="#7D8796"/><text x="444" y="419" font-size="15">Secondary text</text><text x="444" y="442" font-size="14" fill="#4B5563">#4B5563</text><rect x="726" y="400" width="48" height="48" fill="#5F6B7A" stroke="#7D8796"/><text x="789" y="419" font-size="15">Muted text</text><text x="789" y="442" font-size="14" fill="#4B5563">#5F6B7A</text><rect x="36" y="472" width="48" height="48" fill="#4338CA" stroke="#7D8796"/><text x="99" y="491" font-size="15">Accent / focus</text><text x="99" y="514" font-size="14" fill="#4B5563">#4338CA</text><rect x="381" y="472" width="48" height="48" fill="#3730A3" stroke="#7D8796"/><text x="444" y="491" font-size="15">Accent hover</text><text x="444" y="514" font-size="14" fill="#4B5563">#3730A3</text><rect x="726" y="472" width="48" height="48" fill="#312E81" stroke="#7D8796"/><text x="789" y="491" font-size="15">Accent pressed</text><text x="789" y="514" font-size="14" fill="#4B5563">#312E81</text><text x="36" y="573" font-size="19" font-weight="600">Trading and chart roles</text><rect x="36" y="593" width="48" height="48" fill="#2563EB" stroke="#7D8796"/><text x="99" y="612" font-size="15">Buy action</text><text x="99" y="635" font-size="14" fill="#4B5563">#2563EB</text><rect x="381" y="593" width="48" height="48" fill="#DC2626" stroke="#7D8796"/><text x="444" y="612" font-size="15">Sell action</text><text x="444" y="635" font-size="14" fill="#4B5563">#DC2626</text><rect x="726" y="593" width="48" height="48" fill="#0F172A" stroke="#7D8796"/><text x="789" y="612" font-size="15">Neutral price</text><text x="789" y="635" font-size="14" fill="#4B5563">#0F172A</text><rect x="36" y="665" width="48" height="48" fill="#047857" stroke="#7D8796"/><text x="99" y="684" font-size="15">Profit text</text><text x="99" y="707" font-size="14" fill="#4B5563">#047857</text><rect x="381" y="665" width="48" height="48" fill="#B91C1C" stroke="#7D8796"/><text x="444" y="684" font-size="15">Loss text</text><text x="444" y="707" font-size="14" fill="#4B5563">#B91C1C</text><rect x="726" y="665" width="48" height="48" fill="#1D4ED8" stroke="#7D8796"/><text x="789" y="684" font-size="15">Rising quote text</text><text x="789" y="707" font-size="14" fill="#4B5563">#1D4ED8</text><rect x="36" y="737" width="48" height="48" fill="#059669" stroke="#7D8796"/><text x="99" y="756" font-size="15">Bull candle</text><text x="99" y="779" font-size="14" fill="#4B5563">#059669</text><rect x="381" y="737" width="48" height="48" fill="#DC2626" stroke="#7D8796"/><text x="444" y="756" font-size="15">Bear candle</text><text x="444" y="779" font-size="14" fill="#4B5563">#DC2626</text><rect x="726" y="737" width="48" height="48" fill="#64748B" stroke="#7D8796"/><text x="789" y="756" font-size="15">Crosshair</text><text x="789" y="779" font-size="14" fill="#4B5563">#64748B</text><path d="M36 833H1064" stroke="#D1D5DB"/><text x="36" y="860" font-size="14" fill="#4B5563">Text and chart marks have separate colors because their contrast requirements differ.</text><text x="36" y="885" font-size="14" fill="#4B5563">See LIGHT_THEME_COLOR_RESEARCH.md for hover, focus, selected-state and component mapping.</text></g></svg>
