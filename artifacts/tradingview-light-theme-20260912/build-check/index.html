<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="./favicon.png" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RTX 5 Web Terminal</title>
  <script src="./runtime-config.js"></script>
  <script>
    (function prepareInstantShellAndMetrics() {
      var root = document.documentElement;
      var metrics = {};
      var pendingInteraction = null;
      var pendingInteractionTimer = 0;
      var interactionDurations = {};

      function publish(name, durationMs) {
        var value = Number(durationMs);
        if (!Number.isFinite(value)) return;
        value = Math.max(0, Math.round(value * 10) / 10);
        metrics[name] = value;
        root.setAttribute(
          'data-rtx-perf-' + String(name).replace(/[^a-z0-9]+/gi, '-').toLowerCase() + '-ms',
          value.toFixed(1)
        );
      }

      window.__RTX_STARTUP_PERFORMANCE__ = {
        publish: publish,
        beginInteraction: function (label) {
          var normalizedLabel = String(label);
          var now = performance.now();
          if (
            !pendingInteraction
            || pendingInteraction.label !== normalizedLabel
            || now - pendingInteraction.start > 5000
          ) {
            pendingInteraction = { label: normalizedLabel, start: now, form: null };
          }
          return pendingInteraction.start;
        }
      };
      window.__RTX_STARTUP_METRICS__ = metrics;

      function loginFormForEvent(event) {
        var target = event.target;
        if (!(target instanceof Element)) return null;
        if (target.matches('form[data-rtx-login-form]')) return target;
        return target.closest('form[data-rtx-login-form]');
      }

      function captureLoginInteraction(event) {
        var form = loginFormForEvent(event);
        if (!form) return;
        if (event.type === 'pointerdown') {
          var submitTarget = event.target instanceof Element
            ? event.target.closest('[data-rtx-login-submit]')
            : null;
          if (!submitTarget) return;
        }
        if (event.type === 'keydown' && event.key !== 'Enter') return;

        var eventStart = Number(event.timeStamp);
        var now = performance.now();
        if (!Number.isFinite(eventStart) || eventStart < 0 || eventStart > now + 1000) eventStart = now;
        if (
          event.type === 'submit'
          && pendingInteraction
          && pendingInteraction.label === 'login'
          && now - pendingInteraction.start <= 5000
        ) {
          pendingInteraction.form = form;
          return;
        }
        pendingInteraction = { label: 'login', start: eventStart, form: form };
      }

      document.addEventListener('pointerdown', captureLoginInteraction, true);
      document.addEventListener('keydown', captureLoginInteraction, true);
      document.addEventListener('submit', captureLoginInteraction, true);

      try {
        var paintObserver = new PerformanceObserver(function (list) {
          list.getEntries().forEach(function (entry) {
            if (entry.name === 'first-contentful-paint') publish('fcp', entry.startTime);
          });
        });
        paintObserver.observe({ type: 'paint', buffered: true });
      } catch (_) { /* Paint Timing is optional in older embedded browsers. */ }

      try {
        var eventObserver = new PerformanceObserver(function (list) {
          list.getEntries().forEach(function (entry) {
            if (!entry.interactionId) return;
            publish('last-interaction', entry.duration);
            if (!pendingInteraction || entry.startTime < pendingInteraction.start - 50) return;
            if (
              pendingInteraction.form
              && entry.target instanceof Node
              && !pendingInteraction.form.contains(entry.target)
            ) return;

            var key = pendingInteraction.label + ':' + entry.interactionId;
            interactionDurations[key] = Math.max(interactionDurations[key] || 0, entry.duration);
            publish(pendingInteraction.label + '-interaction', interactionDurations[key]);

            window.clearTimeout(pendingInteractionTimer);
            var measuredInteraction = pendingInteraction;
            pendingInteractionTimer = window.setTimeout(function () {
              if (pendingInteraction === measuredInteraction) pendingInteraction = null;
            }, 1000);
          });
        });
        eventObserver.observe({ type: 'event', buffered: true, durationThreshold: 16 });
      } catch (_) { /* Event Timing is optional in older embedded browsers. */ }

      try {
        var longestTask = 0;
        var longTaskObserver = new PerformanceObserver(function (list) {
          list.getEntries().forEach(function (entry) {
            longestTask = Math.max(longestTask, entry.duration);
            publish('long-task-max', longestTask);
            if (pendingInteraction) publish(pendingInteraction.label + '-long-task-max', entry.duration);
          });
        });
        longTaskObserver.observe({ type: 'longtask', buffered: true });
      } catch (_) { /* Long Tasks are optional in older embedded browsers. */ }

      try {
        var resourceObserver = new PerformanceObserver(function (list) {
          list.getEntries().forEach(function (entry) {
            if (!/\/auth\/login(?:[/?#]|$)/i.test(entry.name)) return;
            if (entry.responseEnd > entry.requestStart) {
              publish('auth-network-resource', entry.responseEnd - entry.requestStart);
            }
            if (entry.responseStart > entry.requestStart) {
              publish('auth-ttfb', entry.responseStart - entry.requestStart);
            }
          });
        });
        resourceObserver.observe({ type: 'resource', buffered: true });
      } catch (_) { /* Cross-origin servers can intentionally restrict Resource Timing. */ }

      window.addEventListener('load', function () {
        window.setTimeout(function () {
          var navigation = performance.getEntriesByType('navigation')[0];
          if (!navigation) return;
          publish('navigation-ttfb', navigation.responseStart - navigation.requestStart);
          publish('navigation-response', navigation.responseEnd);
          publish('navigation-interactive', navigation.domInteractive);
          publish('navigation-load', navigation.loadEventEnd);
        }, 0);
      }, { once: true });

      function parseExpiry(value) {
        if (value === null || value === undefined || value === '') return null;
        var raw = String(value).trim();
        var numeric = /^\d+$/.test(raw) ? Number(raw) : NaN;
        if (Number.isFinite(numeric)) return numeric < 100000000000 ? numeric * 1000 : numeric;
        var parsed = Date.parse(raw);
        return Number.isNaN(parsed) ? null : parsed;
      }

      var sessionCandidate = false;
      try {
        var account = localStorage.getItem('rtx_saved_username') || localStorage.getItem('rtx_last_login');
        var token = localStorage.getItem('auth_token') || sessionStorage.getItem('auth_token');
        var refreshToken = localStorage.getItem('refresh_token') || sessionStorage.getItem('refresh_token');
        var expiresAt = parseExpiry(
          localStorage.getItem('token_expires_at') || sessionStorage.getItem('token_expires_at')
        );
        sessionCandidate = Boolean(
          account
          && (token || refreshToken)
          && (expiresAt === null || expiresAt > Date.now())
        );
      } catch (_) { /* Storage can be unavailable in hardened browser contexts. */ }

      root.setAttribute('data-rtx-initial-view', sessionCandidate ? 'terminal' : 'login');
      if (!sessionCandidate) {
        var wordmarkPreload = document.createElement('link');
        wordmarkPreload.rel = 'preload';
        wordmarkPreload.as = 'image';
        wordmarkPreload.href = './brand/rtx5-login-wordmark.png';
        wordmarkPreload.type = 'image/png';
        wordmarkPreload.setAttribute('fetchpriority', 'high');
        document.head.appendChild(wordmarkPreload);

        // Resolve the broker visual from runtime configuration or the last
        // verified presentation cache, then load its responsive source in
        // parallel with the real login JavaScript.
        var heroIdentity = '';
        try {
          heroIdentity = JSON.stringify(window.RUNTIME_CONFIG || window.__RTX_RUNTIME_CONFIG__ || {})
            + ' ' + (localStorage.getItem('rtx_broker_presentation_v1') || '')
            + ' ' + window.location.hostname;
        } catch (_) { /* Use the TEST/default hero. */ }
        heroIdentity = heroIdentity.toLowerCase().replace(/[^a-z0-9]+/g, '');
        var desktopHeroPath = './login/trading-desk-hero.webp';
        var mobileHeroPath = './login/trading-desk-hero-mobile.webp';
        var mobileHeroType = 'image/webp';
        if (heroIdentity.indexOf('myprop') >= 0) {
          desktopHeroPath = './login/myprop-hero-wide.webp';
          mobileHeroPath = './login/myprop-hero-mobile.jpg';
          mobileHeroType = 'image/jpeg';
        } else if (heroIdentity.indexOf('achiever') >= 0 || heroIdentity.indexOf('achiver') >= 0) {
          desktopHeroPath = './login/achiever-hero-desktop-fit.webp';
          mobileHeroPath = './login/achiever-hero-mobile.jpg';
          mobileHeroType = 'image/jpeg';
        } else if (heroIdentity.indexOf('growtradingacademy') >= 0 || heroIdentity.indexOf('gtabroker') >= 0) {
          desktopHeroPath = './login/gta-hero-desktop-fit.webp';
          mobileHeroPath = './login/gta-hero-mobile.jpg';
          mobileHeroType = 'image/jpeg';
        }
        var heroPreload = document.createElement('link');
        heroPreload.rel = 'preload';
        heroPreload.as = 'image';
        heroPreload.href = desktopHeroPath;
        heroPreload.type = 'image/webp';
        heroPreload.media = '(min-width: 761px)';
        heroPreload.setAttribute('fetchpriority', 'high');
        document.head.appendChild(heroPreload);

        var mobileHeroPreload = document.createElement('link');
        mobileHeroPreload.rel = 'preload';
        mobileHeroPreload.as = 'image';
        mobileHeroPreload.href = mobileHeroPath;
        mobileHeroPreload.type = mobileHeroType;
        mobileHeroPreload.media = '(max-width: 760px)';
        mobileHeroPreload.setAttribute('fetchpriority', 'high');
        document.head.appendChild(mobileHeroPreload);
      }
      performance.mark('rtx-instant-shell-selected');
    })();
  </script>
  <style>
    :root { color-scheme: dark; }
    html, body, #root { width: 100%; min-height: 100%; height: 100%; background: #050608; }
    body { margin: 0; overflow: hidden; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }

    .rtx-instant-terminal { display: flex; flex-direction: column; width: 100%; height: 100vh; background: #0d0d11; color: #cbd5e1; }
    .rtx-instant-titlebar { display: flex; align-items: center; height: 34px; padding: 0 12px; border-bottom: 1px solid #28282e; font-size: 13px; }
    .rtx-instant-toolbar { display: flex; align-items: center; gap: 20px; height: 46px; padding: 0 14px; border-bottom: 1px solid #28282e; color: #94a3b8; font-size: 12px; }
    .rtx-instant-workspace { display: grid; flex: 1; grid-template-columns: 280px minmax(0, 1fr); min-height: 0; }
    .rtx-instant-sidebar { display: grid; grid-template-rows: 45% 55%; border-right: 1px solid #28282e; background: #111117; }
    .rtx-instant-sidebar div { padding: 10px; color: #64748b; font-size: 12px; }
    .rtx-instant-sidebar div:first-child { border-bottom: 1px solid #28282e; }
    .rtx-instant-main { display: grid; grid-template-rows: minmax(0, 1fr) 250px; min-width: 0; }
    .rtx-instant-chart { border-bottom: 1px solid #28282e; background: radial-gradient(circle at 50% 45%, rgba(20, 35, 55, .25), transparent 52%), #07090d; }
    .rtx-instant-toolbox { background: #101116; }

    [data-rtx-static-shell] { width: 100%; height: 100%; background: #050608; }
    [data-rtx-static-shell] > .rtx-instant-terminal { display: none; }
    html[data-rtx-initial-view="terminal"] [data-rtx-static-shell] > .rtx-instant-terminal { display: flex; }

    @media (max-width: 900px) {
      .rtx-instant-workspace { grid-template-columns: 1fr; }
      .rtx-instant-sidebar { display: none; }
    }
  </style>
  <script type="module" crossorigin src="./assets/index-C89yUjhD.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-CcLpa82Z.css">
</head>

<body>
  <div id="root">
    <div data-rtx-static-shell aria-busy="true" inert>
      <div class="rtx-instant-terminal" aria-label="Terminal shell">
        <div class="rtx-instant-titlebar">RTX 5 Web Terminal</div>
        <div class="rtx-instant-toolbar"><span>File</span><span>View</span><span>Insert</span><span>Charts</span><span>Tools</span><span>Window</span><span>Help</span></div>
        <div class="rtx-instant-workspace">
          <div class="rtx-instant-sidebar"><div>MARKET WATCH</div><div>NAVIGATOR</div></div>
          <div class="rtx-instant-main"><div class="rtx-instant-chart"></div><div class="rtx-instant-toolbox"></div></div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
