<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RTX5 Future Grid Continuity QA</title>
    <style>
      html, body, #chart { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
      body { font-family: Arial, sans-serif; }
      .label {
        position: fixed;
        z-index: 2;
        top: 12px;
        left: 14px;
        color: #d0d5dd;
        font: 12px/1.3 Arial, sans-serif;
        pointer-events: none;
      }
      .label strong { color: #fff; }
    </style>
  </head>
  <body>
    <div id="chart" data-testid="grid-qa"></div>
    <div class="label"><strong>EURUSD, M1</strong> · future grid continuity</div>

    <script type="module">
      import {
        CandlestickSeries,
        ColorType,
        LineSeries,
        LineStyle,
        createChart,
      } from 'lightweight-charts';
      import { getChartGridLineColors } from '/src/utils/chartGridStyle.ts';
      import {
        SQUARE_CHART_GRID_CELL_SIZE_PX,
        SquareChartGridPrimitive,
      } from '/src/utils/squareChartGridPrimitive.ts';

      const background = '#000000';
      const grid = getChartGridLineColors({
        background,
        grid: 'rgba(255,255,255,0.15)',
        showGrid: true,
      });
      const chart = createChart(document.querySelector('#chart'), {
        autoSize: true,
        layout: {
          background: { type: ColorType.Solid, color: background },
          textColor: '#98a2b3',
          fontFamily: 'Arial, sans-serif',
          fontSize: 11,
          attributionLogo: false,
        },
        grid: {
          vertLines: { color: grid.vertical, style: LineStyle.Solid, visible: false },
          horzLines: { color: grid.horizontal, style: LineStyle.Solid, visible: false },
        },
        rightPriceScale: {
          borderColor: '#344054',
          scaleMargins: { top: 0.08, bottom: 0.25 },
        },
        timeScale: {
          borderColor: '#344054',
          timeVisible: true,
          secondsVisible: false,
          barSpacing: 12,
          minBarSpacing: 0.5,
          shiftVisibleRangeOnNewBar: false,
          allowShiftVisibleRangeOnWhitespaceReplacement: false,
        },
      });

      const candles = chart.addSeries(CandlestickSeries, {
        upColor: '#10b981',
        downColor: '#ef4444',
        borderUpColor: '#10b981',
        borderDownColor: '#ef4444',
        wickUpColor: '#10b981',
        wickDownColor: '#ef4444',
        priceLineVisible: false,
        lastValueVisible: false,
      });
      const squareGridHost = chart.addSeries(LineSeries, {
        visible: true,
        color: 'rgba(0,0,0,0)',
        priceScaleId: '',
        priceLineVisible: false,
        lastValueVisible: false,
        crosshairMarkerVisible: false,
      });
      squareGridHost.attachPrimitive(new SquareChartGridPrimitive({
        visible: true,
        cellSizeCssPx: SQUARE_CHART_GRID_CELL_SIZE_PX,
        verticalColor: grid.vertical,
        horizontalColor: grid.horizontal,
      }));

      const start = Date.UTC(2026, 7, 31, 4, 0, 0) / 1000;
      const data = [];
      let previousClose = 1.1594;
      for (let index = 0; index < 120; index += 1) {
        const drift = (Math.sin(index / 5.2) * 0.00024) + (Math.cos(index / 13) * 0.00012);
        const open = previousClose;
        const close = 1.1590 + drift + (index * 0.0000014);
        const high = Math.max(open, close) + 0.00007;
        const low = Math.min(open, close) - 0.00007;
        data.push({ time: start + (index * 60), open, high, low, close });
        previousClose = close;
      }

      candles.setData(data);
      const qaFixture = document.querySelector('[data-testid="grid-qa"]');
      qaFixture.dataset.ready = 'false';
      setTimeout(() => {
        chart.timeScale().scrollToPosition(40, false);
        qaFixture.dataset.ready = 'true';
        qaFixture.dataset.cellSize = String(SQUARE_CHART_GRID_CELL_SIZE_PX);
        qaFixture.dataset.lastCandleLogicalIndex = String(data.length - 1);
        qaFixture.dataset.visibleRange = JSON.stringify(chart.timeScale().getVisibleLogicalRange());
        qaFixture.dataset.lastCandleCoordinate = String(chart.timeScale().timeToCoordinate(data[data.length - 1].time));
        window.__gridQa = {
          cellSize: SQUARE_CHART_GRID_CELL_SIZE_PX,
          lastCandleTime: data[data.length - 1].time,
          visibleRange: chart.timeScale().getVisibleLogicalRange(),
        };
      }, 100);
    </script>
  </body>
</html>
