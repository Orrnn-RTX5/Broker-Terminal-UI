<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RTX5 Native Chart Grid Preview</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #09090b;
        color: #f2f4f7;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background:
          radial-gradient(circle at 50% -20%, rgba(71, 84, 103, 0.16), transparent 42%),
          #09090b;
      }

      button { font: inherit; }

      .page {
        min-height: 100vh;
        padding: 24px;
        display: grid;
        place-items: center;
      }

      .frame {
        width: min(1480px, 100%);
        height: min(820px, calc(100vh - 48px));
        min-height: 560px;
        overflow: hidden;
        border: 1px solid #27272a;
        border-radius: 12px;
        background: #000000;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
        transition: width 180ms ease;
      }

      .frame.compact { width: min(920px, 100%); }

      .header {
        height: 52px;
        padding: 0 14px 0 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        border-bottom: 1px solid #222226;
        background: #0d0d0f;
      }

      .identity, .actions, .market, .status { display: flex; align-items: center; }
      .identity { gap: 10px; min-width: 0; }
      .actions { gap: 8px; }

      .mark {
        width: 26px;
        height: 26px;
        display: grid;
        place-items: center;
        border-radius: 7px;
        background: #18181b;
        color: #f9fafb;
        font-size: 11px;
        font-weight: 760;
        letter-spacing: -0.02em;
      }

      .title { font-size: 13px; font-weight: 650; }
      .subtitle { margin-top: 2px; color: #71717a; font-size: 10px; letter-spacing: 0.04em; }

      .action {
        min-height: 30px;
        padding: 0 10px;
        border: 1px solid #2b2b30;
        border-radius: 6px;
        background: #151518;
        color: #a1a1aa;
        cursor: pointer;
      }

      .action:hover { border-color: #3f3f46; color: #f4f4f5; }
      .action[aria-pressed="true"] { border-color: #3f3f46; background: #202024; color: #ffffff; }

      .chart-header {
        height: 56px;
        padding: 0 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        border-bottom: 1px solid #17171a;
        background: #050506;
      }

      .market { gap: 10px; }
      .symbol { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
      .interval {
        padding: 3px 6px;
        border: 1px solid #2a2a2f;
        border-radius: 4px;
        color: #a1a1aa;
        font: 600 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      .description { color: #71717a; font-size: 11px; }
      .status { gap: 8px; color: #71717a; font-size: 10px; }
      .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #12b76a; box-shadow: 0 0 0 3px rgba(18, 183, 106, 0.10); }

      .chart-wrap { position: relative; height: calc(100% - 108px); background: #000000; }
      #chart { position: absolute; inset: 0; }

      .ohlc {
        position: absolute;
        z-index: 2;
        top: 11px;
        left: 16px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        pointer-events: none;
        color: #73737c;
        font: 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      .ohlc strong { color: #a1a1aa; font-weight: 550; }
      .ohlc .positive, .change { color: #12b76a; }

      .note {
        position: absolute;
        z-index: 2;
        right: 78px;
        bottom: 30px;
        padding: 6px 8px;
        border: 1px solid rgba(255, 255, 255, 0.07);
        border-radius: 5px;
        background: rgba(12, 12, 14, 0.86);
        color: #62626c;
        font-size: 9px;
        letter-spacing: 0.02em;
        pointer-events: none;
      }

      @media (max-width: 700px) {
        .page { padding: 0; }
        .frame { height: 100vh; min-height: 480px; border: 0; border-radius: 0; }
        .description, .subtitle, .note { display: none; }
        .header { padding-inline: 10px; }
        .chart-header { padding-inline: 10px; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="frame" id="frame" aria-label="RTX5 chart grid QA preview">
        <header class="header">
          <div class="identity">
            <span class="mark">R5</span>
            <div>
              <div class="title">Chart grid quality review</div>
              <div class="subtitle">NATIVE SCALE-AWARE RENDERING</div>
            </div>
          </div>
          <div class="actions">
            <button class="action" id="gridToggle" type="button" aria-pressed="true">Grid on</button>
            <button class="action" id="widthToggle" type="button" aria-pressed="false">Compact</button>
          </div>
        </header>

        <div class="chart-header">
          <div class="market">
            <span class="symbol">BTCUSD</span>
            <span class="interval">M1</span>
            <span class="description">Bitcoin / U.S. Dollar</span>
          </div>
          <div class="status"><span class="status-dot"></span>Live surface</div>
        </div>

        <div class="chart-wrap">
          <div id="chart"></div>
          <div class="ohlc" aria-hidden="true">
            <span>O <strong>77,422.80</strong></span>
            <span>H <strong>77,454.10</strong></span>
            <span>L <strong>77,416.45</strong></span>
            <span>C <strong>77,447.90</strong></span>
            <span class="positive">+25.10 (+0.03%)</span>
          </div>
          <div class="note">Horizontal price guides · Vertical time guides</div>
        </div>
      </section>
    </main>

    <script type="module">
      import {
        CandlestickSeries,
        ColorType,
        CrosshairMode,
        LineStyle,
        createChart,
      } from 'lightweight-charts';
      import { getChartGridLineColors } from '/src/utils/chartGridStyle.ts';

      const chartElement = document.querySelector('#chart');
      const frame = document.querySelector('#frame');
      const gridToggle = document.querySelector('#gridToggle');
      const widthToggle = document.querySelector('#widthToggle');
      const surface = '#000000';
      const grid = getChartGridLineColors({
        background: surface,
        grid: 'rgba(255,255,255,0.15)',
        showGrid: true,
      });

      const chart = createChart(chartElement, {
        autoSize: true,
        layout: {
          background: { type: ColorType.Solid, color: surface },
          textColor: '#73737c',
          fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace',
          fontSize: 10,
          attributionLogo: false,
        },
        grid: {
          vertLines: { color: grid.vertical, style: LineStyle.Solid, visible: true },
          horzLines: { color: grid.horizontal, style: LineStyle.Solid, visible: true },
        },
        crosshair: {
          mode: CrosshairMode.Normal,
          vertLine: { color: 'rgba(255,255,255,0.42)', width: 1, style: LineStyle.Dashed, labelBackgroundColor: '#27272a' },
          horzLine: { color: 'rgba(255,255,255,0.42)', width: 1, style: LineStyle.Dashed, labelBackgroundColor: '#27272a' },
        },
        rightPriceScale: {
          visible: true,
          borderColor: '#242428',
          scaleMargins: { top: 0.13, bottom: 0.10 },
        },
        timeScale: {
          visible: true,
          borderColor: '#242428',
          timeVisible: true,
          secondsVisible: false,
          rightOffset: 8,
          barSpacing: 7.6,
          minBarSpacing: 4,
          fixLeftEdge: false,
          fixRightEdge: false,
        },
        handleScale: true,
        handleScroll: true,
      });

      const candles = chart.addSeries(CandlestickSeries, {
        upColor: '#12b76a',
        downColor: '#f04438',
        borderUpColor: '#12b76a',
        borderDownColor: '#f04438',
        wickUpColor: '#12b76a',
        wickDownColor: '#f04438',
        priceFormat: { type: 'price', precision: 2, minMove: 0.01 },
      });

      const start = Math.floor(Date.UTC(2026, 7, 29, 3, 0, 0) / 1000);
      const data = [];
      let previousClose = 77310;
      for (let index = 0; index < 176; index += 1) {
        const drift = (index * 0.78) + (Math.sin(index / 11) * 37) + (Math.sin(index / 3.7) * 11);
        const open = previousClose + (Math.sin(index * 1.91) * 4.5);
        const close = 77310 + drift + (Math.cos(index * 1.37) * 7.5);
        const high = Math.max(open, close) + 5 + Math.abs(Math.sin(index * 0.73) * 8);
        const low = Math.min(open, close) - 5 - Math.abs(Math.cos(index * 0.61) * 8);
        data.push({ time: start + (index * 60), open, high, low, close });
        previousClose = close;
      }
      candles.setData(data);
      chart.timeScale().fitContent();

      let gridVisible = true;
      gridToggle.addEventListener('click', () => {
        gridVisible = !gridVisible;
        gridToggle.textContent = gridVisible ? 'Grid on' : 'Grid off';
        gridToggle.setAttribute('aria-pressed', String(gridVisible));
        chart.applyOptions({
          grid: {
            vertLines: { color: grid.vertical, style: LineStyle.Solid, visible: gridVisible },
            horzLines: { color: grid.horizontal, style: LineStyle.Solid, visible: gridVisible },
          },
        });
      });

      widthToggle.addEventListener('click', () => {
        const compact = frame.classList.toggle('compact');
        widthToggle.textContent = compact ? 'Full width' : 'Compact';
        widthToggle.setAttribute('aria-pressed', String(compact));
        requestAnimationFrame(() => chart.timeScale().fitContent());
      });
    </script>
  </body>
</html>
