<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navigator header comparison</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 20px;
        background: #0d0d11;
        color: #e5e7eb;
        font: 14px/1.4 Arial, sans-serif;
      }
      h1 { margin: 0 0 16px; font-size: 20px; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      section { overflow: hidden; border: 1px solid #3f3f46; background: #131316; }
      h2 { margin: 0; padding: 10px 12px; border-bottom: 1px solid #3f3f46; font-size: 14px; }
      p { margin: 0; padding: 8px 12px; color: #a1a1aa; }
      img { display: block; width: 100%; height: auto; }
    </style>
  </head>
  <body>
    <h1>Navigator duplicate-header correction</h1>
    <main>
      <section>
        <h2>Before — duplicate inner NAVIGATOR strip</h2>
        <img src="/artifacts/desktop-toolbar-dynamic-status/09-final-xauusd-live.png" alt="Terminal before correction" />
        <p>The dock title and the second uppercase content header are both visible.</p>
      </section>
      <section>
        <h2>After — one dock title with close control</h2>
        <img src="/artifacts/navigator-single-header-2026-09-01/after-single-header.jpg" alt="Terminal after correction" />
        <p>The account tree starts directly below the retained Navigator title bar.</p>
      </section>
    </main>
  </body>
</html>
